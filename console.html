<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>ZEN OS · 管理控制台</title>
<style>
:root{
  --bg:#080c16;--panel:rgba(20,27,48,.82);--panel2:rgba(127,127,127,.08);
  --text:#f4f6ff;--muted:#9da7c3;--border:rgba(255,255,255,.11);
  --accent:#6878ff;--accent2:#865fff;--danger:#ff5f73;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;background:radial-gradient(circle at 50% 0%,rgba(104,120,255,.18),transparent 38%),var(--bg);color:var(--text)}
body{padding:24px 16px 40px}
.wrap{width:min(720px,100%);margin:auto}
.card{background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.28);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
h1{margin:0;font-size:24px}
.sub{color:var(--muted);font-size:13px;margin:6px 0 22px}
label{display:block;font-size:13px;font-weight:800;margin:16px 0 7px}
input,textarea{width:100%;border:1px solid var(--border);border-radius:13px;background:rgba(0,0,0,.18);color:var(--text);padding:12px 13px;outline:none;font:inherit}
input:focus,textarea:focus{border-color:rgba(104,120,255,.75);box-shadow:0 0 0 3px rgba(104,120,255,.12)}
textarea{min-height:130px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:14px}
.check input{width:auto}
button{border:0;border-radius:13px;padding:12px 16px;font:inherit;font-weight:850;cursor:pointer;color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));touch-action:manipulation}
button.secondary{background:var(--panel2);border:1px solid var(--border)}
button.danger{background:rgba(255,95,115,.12);border:1px solid rgba(255,95,115,.3);color:#ff8b9a}
button:disabled{opacity:.55;cursor:not-allowed}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.status{margin-top:14px;padding:11px 13px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);font-size:13px;display:none}
.status.show{display:block}.ok{color:#78e6a5}.err{color:#ff8b9a}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:22px 0 12px;flex-wrap:wrap}
.item{border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:10px;background:rgba(127,127,127,.05)}
.item h3{margin:0 0 6px;font-size:16px}
.meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.content{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55}
.badge{display:inline-block;font-size:11px;padding:3px 7px;border-radius:99px;background:rgba(104,120,255,.16);margin-left:5px}
.small{font-size:12px;color:var(--muted)}
@media(max-width:520px){body{padding:12px}.card{padding:17px;border-radius:19px}.actions button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>ZEN OS · 管理控制台</h1>
    <div class="sub">公告管理 · 管理密钥只保存在当前浏览器，不会写入页面源码。</div>

    <label for="api">API 地址</label>
    <input id="api" value="https://zenos-91.onrender.com">

    <label for="key">ADMIN_API_KEY</label>
    <input id="key" type="password" autocomplete="off" placeholder="输入 Render 环境变量中的 ADMIN_API_KEY">

    <div class="actions">
      <button id="test" type="button">测试 API</button>
      <button id="load" type="button" class="secondary">加载公告</button>
    </div>

    <div id="status" class="status"></div>

    <hr style="border:0;border-top:1px solid var(--border);margin:22px 0">

    <h2 style="font-size:18px;margin:0">发布公告</h2>

    <label for="title">标题</label>
    <input id="title" maxlength="120" placeholder="例如：ZEN OS V20 即将发布">

    <label for="content">内容</label>
    <textarea id="content" maxlength="5000" placeholder="输入公告内容"></textarea>

    <div class="row">
      <label class="check"><input id="pinned" type="checkbox"> 置顶</label>
      <label class="check"><input id="isNew" type="checkbox" checked> 标记为新</label>
    </div>

    <div class="actions">
      <button id="publish" type="button">发布公告</button>
      <button id="clear" type="button" class="secondary">清空</button>
    </div>

    <div class="toolbar">
      <h2 style="font-size:18px;margin:0">现有公告</h2>
      <span class="small">仅管理员可修改/删除</span>
    </div>
    <div id="list"><div class="small">点击“加载公告”查看。</div></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const api=()=>($("api").value||"").trim().replace(/\/$/,"");
const headers=()=>({
  "Content-Type":"application/json",
  "Authorization":"Bearer "+$("key").value.trim()
});
function status(msg,ok=true){
  const el=$("status"); el.className="status show "+(ok?"ok":"err"); el.textContent=msg;
}
async function request(url,opt={}){
  const r=await fetch(url,opt);
  let data={}; try{data=await r.json()}catch{}
  if(!r.ok) throw new Error(data.error||("HTTP "+r.status));
  return data;
}
async function test(){
  try{
    const d=await request(api()+"/api/health");
    status("🟢 API 在线 · "+(d.service||"ZEN OS API"));
  }catch(e){status("🔴 API 连接失败："+e.message,false)}
}
function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
async function load(){
  try{
    const d=await request(api()+"/api/announcements");
    const arr=Array.isArray(d.announcements)?d.announcements:[];
    if(!arr.length){$("list").innerHTML='<div class="small">暂无公告。</div>';return}
    $("list").innerHTML=arr.map(x=>`
      <div class="item">
        <h3>${esc(x.title||"无标题")}${x.pinned?'<span class="badge">置顶</span>':""}${x.isNew?'<span class="badge">NEW</span>':""}</h3>
        <div class="meta">${esc(x.date||"")} · ID ${esc(x.id)}</div>
        <div class="content">${esc(x.content||"")}</div>
        <div class="actions">
          <button type="button" class="secondary" data-edit="${esc(x.id)}">编辑</button>
          <button type="button" class="danger" data-del="${esc(x.id)}">删除</button>
        </div>
      </div>`).join("");
  }catch(e){status("加载公告失败："+e.message,false)}
}
async function publish(){
  const title=$("title").value.trim(), content=$("content").value.trim();
  if(!$("key").value.trim()){status("请先输入 ADMIN_API_KEY。",false);return}
  if(!title&&!content){status("标题或内容至少填写一个。",false);return}
  $("publish").disabled=true;
  try{
    await request(api()+"/api/admin/announcements",{
      method:"POST",headers:headers(),
      body:JSON.stringify({title,content,pinned:$("pinned").checked,isNew:$("isNew").checked})
    });
    status("🟢 公告发布成功！");
    $("title").value="";$("content").value="";$("pinned").checked=false;$("isNew").checked=true;
    await load();
  }catch(e){status("发布失败："+e.message,false)}
  finally{$("publish").disabled=false}
}
async function edit(id){
  const title=prompt("修改标题："); if(title===null)return;
  const content=prompt("修改内容："); if(content===null)return;
  try{
    await request(api()+"/api/admin/announcements/"+encodeURIComponent(id),{
      method:"PUT",headers:headers(),body:JSON.stringify({title,content})
    });
    status("🟢 修改成功"); await load();
  }catch(e){status("修改失败："+e.message,false)}
}
async function del(id){
  if(!confirm("确定删除这条公告吗？"))return;
  try{
    await request(api()+"/api/admin/announcements/"+encodeURIComponent(id),{
      method:"DELETE",headers:headers()
    });
    status("🟢 删除成功"); await load();
  }catch(e){status("删除失败："+e.message,false)}
}
$("test").onclick=test;
$("load").onclick=load;
$("publish").onclick=publish;
$("clear").onclick=()=>{$("title").value="";$("content").value="";$("pinned").checked=false;$("isNew").checked=true};
$("list").addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]"), de=e.target.closest("[data-del]");
  if(ed)edit(ed.dataset.edit);
  if(de)del(de.dataset.del);
});
</script>
</body>
</html>
