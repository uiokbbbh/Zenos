<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c16"><title>ZEN OS · 控制中心</title><style>
:root{--bg:#070b14;--p:#12192c;--p2:rgba(255,255,255,.055);--t:#f5f7ff;--m:#98a4c1;--b:rgba(255,255,255,.11);--a:#6d7cff;--a2:#8a5cff;--g:#66e39a;--r:#ff7184}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;background:radial-gradient(circle at 15% 0%,rgba(109,124,255,.18),transparent 34%),radial-gradient(circle at 90% 10%,rgba(138,92,255,.14),transparent 32%),var(--bg);color:var(--t)}body{padding:14px}.wrap{width:min(980px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:950;font-size:20px;background:linear-gradient(135deg,var(--a),var(--a2))}.title{font-size:21px;font-weight:900}.sub{font-size:12px;color:var(--m)}.card{background:rgba(18,25,44,.88);border:1px solid var(--b);border-radius:22px;padding:17px;box-shadow:0 18px 55px rgba(0,0,0,.28);backdrop-filter:blur(18px);margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:13px;border:1px solid var(--b);border-radius:15px;background:var(--p2)}.k{font-size:11px;color:var(--m)}.v{font-size:19px;font-weight:900;margin-top:4px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;border:1px solid var(--b);background:var(--p2);color:var(--m);padding:10px 13px;border-radius:12px;font-weight:800}.tab.active{color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent}.panel{display:none}.panel.active{display:block}label{display:block;font-size:12px;font-weight:850;color:var(--m);margin:12px 0 6px}input,textarea{width:100%;border:1px solid var(--b);border-radius:12px;background:rgba(0,0,0,.18);color:var(--t);padding:11px 12px;outline:none;font:inherit}textarea{min-height:105px;resize:vertical}input:focus,textarea:focus{border-color:rgba(109,124,255,.8);box-shadow:0 0 0 3px rgba(109,124,255,.12)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:850;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--a),var(--a2))}button.secondary{background:var(--p2);border:1px solid var(--b)}button.danger{background:rgba(255,113,132,.1);border:1px solid rgba(255,113,132,.28);color:#ff9aaa}button:disabled{opacity:.55}.status{display:none;margin-top:11px;padding:10px 12px;border-radius:12px;border:1px solid var(--b);background:var(--p2);font-size:13px}.status.show{display:block}.ok{color:var(--g)}.err{color:var(--r)}.item{border:1px solid var(--b);border-radius:15px;padding:12px;margin-top:9px;background:rgba(255,255,255,.025)}.item h3{font-size:15px;margin:0 0 5px}.meta{font-size:11px;color:var(--m);margin-bottom:7px}.content{font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.badge{display:inline-block;font-size:10px;padding:3px 7px;border-radius:99px;background:rgba(109,124,255,.16);margin-left:5px}.small{font-size:12px;color:var(--m)}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h2{font-size:17px;margin:0}hr{border:0;border-top:1px solid var(--b);margin:18px 0}.check{display:flex;align-items:center;gap:7px;color:var(--m);font-size:12px;margin-top:10px}.check input{width:auto}.checks{display:flex;gap:16px}@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}}@media(max-width:520px){body{padding:9px}.card{padding:14px;border-radius:18px}.row{grid-template-columns:1fr}.actions button{flex:1}.title{font-size:18px}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand"><div class="logo">Z</div><div><div class="title">ZEN OS · 控制中心</div><div class="sub">系统状态 · 公告 · ZEN Chat · Bot 管理</div></div></div><button class="secondary" id="refresh">↻ 刷新</button></div>
<div class="stats"><div class="stat"><div class="k">API</div><div class="v" id="apiState">未知</div></div><div class="stat"><div class="k">公告</div><div class="v" id="annCount">—</div></div><div class="stat"><div class="k">聊天室消息</div><div class="v" id="chatCount">—</div></div><div class="stat"><div class="k">Bot</div><div class="v" id="botCount">—</div></div></div>
<div class="card"><div class="tabs"><button class="tab active" data-tab="system">系统</button><button class="tab" data-tab="notice">公告</button><button class="tab" data-tab="chat">聊天室</button><button class="tab" data-tab="bots">Bot</button></div>
<section class="panel active" id="panel-system"><div class="head"><h2>连接设置</h2><span class="small">密钥只保存在当前浏览器</span></div><label>API 地址</label><input id="api" value="https://zenos-91.onrender.com"><label>ADMIN_API_KEY</label><input id="key" type="password" autocomplete="off" placeholder="输入 Render 环境变量中的 ADMIN_API_KEY"><div class="actions"><button id="test">测试 API</button><button class="secondary" id="save">保存设置</button><button class="secondary" id="clearKey">清除密钥</button></div><div id="status" class="status"></div><hr><div class="head"><h2>服务检查</h2><span class="small">检查公告、聊天室和 Bot 接口</span></div><div class="actions"><button id="checkAll">检查全部</button></div></section>
<section class="panel" id="panel-notice"><div class="head"><h2>发布公告</h2><button class="secondary" id="loadNotice">刷新</button></div><label>标题</label><input id="title" maxlength="120" placeholder="例如：ZEN AI 服务更新公告"><label>内容</label><textarea id="content" maxlength="5000" placeholder="输入公告内容"></textarea><div class="checks"><label class="check"><input id="pinned" type="checkbox"> 置顶</label><label class="check"><input id="isNew" type="checkbox" checked> NEW</label></div><div class="actions"><button id="publish">发布公告</button><button class="secondary" id="clearNotice">清空</button></div><div id="noticeList"></div></section>
<section class="panel" id="panel-chat"><div class="head"><h2>聊天室管理</h2><button class="secondary" id="loadChat">刷新消息</button></div><div class="small" style="margin-top:6px">在线人数：<b id="online">—</b></div><div id="chatList"></div></section>
<section class="panel" id="panel-bots"><div class="head"><h2>Bot 管理</h2><button class="secondary" id="loadBots">刷新 Bot</button></div><div class="row"><div><label>Bot 名称</label><input id="botName" maxlength="32" placeholder="例如：ZEN 公告助手"></div><div><label>头像</label><input id="botAvatar" maxlength="8" value="🤖"></div></div><div class="actions"><button id="addBot">创建 Bot</button></div><div id="botList"></div></section>
</div></div>
<script>
const $=id=>document.getElementById(id),api=()=>($('api').value||'').trim().replace(/\/+$/,''),headers=()=>({'Content-Type':'application/json','Authorization':'Bearer '+$('key').value.trim()});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(x,ok=true){const e=$('status');e.className='status show '+(ok?'ok':'err');e.textContent=x}async function req(u,o={}){const r=await fetch(u,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function loadSettings(){const a=localStorage.getItem('ZEN_OS_CONSOLE_API'),k=localStorage.getItem('ZEN_OS_CONSOLE_KEY');if(a)$('api').value=a;if(k)$('key').value=k}function saveSettings(){localStorage.setItem('ZEN_OS_CONSOLE_API',$('api').value.trim());localStorage.setItem('ZEN_OS_CONSOLE_KEY',$('key').value.trim());show('设置已保存')}async function test(){try{const d=await req(api()+'/api/health');$('apiState').textContent='在线';show('🟢 API 在线 · '+(d.service||'ZEN OS API'))}catch(e){$('apiState').textContent='离线';show('🔴 API 连接失败：'+e.message,false)}}
async function loadNotice(){try{const d=await req(api()+'/api/announcements'),a=Array.isArray(d.announcements)?d.announcements:[];$('annCount').textContent=a.length;$('noticeList').innerHTML=a.length?a.map(x=>`<div class=item><h3>${esc(x.title||'无标题')}${x.pinned?'<span class=badge>置顶</span>':''}${x.isNew?'<span class=badge>NEW</span>':''}</h3><div class=meta>${esc(x.date||'')} · ID ${esc(x.id)}</div><div class=content>${esc(x.content||'')}</div><div class=actions><button class=secondary data-edit-ann="${esc(x.id)}">编辑</button><button class=danger data-del-ann="${esc(x.id)}">删除</button></div></div>`).join(''):'<div class=small style="margin-top:12px">暂无公告。</div>'}catch(e){show('加载公告失败：'+e.message,false)}}
async function publish(){const title=$('title').value.trim(),content=$('content').value.trim();if(!$('key').value.trim())return show('请先输入 ADMIN_API_KEY。',false);if(!title&&!content)return show('标题或内容至少填写一个。',false);try{await req(api()+'/api/admin/announcements',{method:'POST',headers:headers(),body:JSON.stringify({title,content,pinned:$('pinned').checked,isNew:$('isNew').checked})});show('🟢 公告发布成功');$('title').value='';$('content').value='';$('pinned').checked=false;$('isNew').checked=true;loadNotice()}catch(e){show('发布失败：'+e.message,false)}}
async function editAnn(id){const title=prompt('修改标题：');if(title===null)return;const content=prompt('修改内容：');if(content===null)return;try{await req(api()+'/api/admin/announcements/'+encodeURIComponent(id),{method:'PUT',headers:headers(),body:JSON.stringify({title,content})});show('🟢 修改成功');loadNotice()}catch(e){show('修改失败：'+e.message,false)}}async function delAnn(id){if(!confirm('确定删除这条公告吗？'))return;try{await req(api()+'/api/admin/announcements/'+encodeURIComponent(id),{method:'DELETE',headers:headers()});show('🟢 删除成功');loadNotice()}catch(e){show('删除失败：'+e.message,false)}}
async function loadChat(){try{const [m,p]=await Promise.all([req(api()+'/api/chat/messages'),req(api()+'/api/chat/presence')]),a=Array.isArray(m.messages)?m.messages:[];$('online').textContent=p.onlineCount??0;$('chatCount').textContent=a.length;$('chatList').innerHTML=a.length?a.slice().reverse().map(x=>`<div class=item><h3>${esc(x.name||'ZEN用户')}${x.isBot?'<span class=badge>BOT</span>':''}</h3><div class=meta>${esc(x.date||'')} · ID ${esc(x.id)}</div><div class=content>${esc(x.content||'')}</div><div class=actions><button class=danger data-del-msg="${esc(x.id)}">删除消息</button></div></div>`).join(''):'<div class=small style="margin-top:12px">暂无消息。</div>'}catch(e){show('加载聊天室失败：'+e.message,false)}}async function delMsg(id){if(!confirm('确定删除这条消息吗？'))return;try{await req(api()+'/api/admin/chat/messages/'+encodeURIComponent(id),{method:'DELETE',headers:headers()});show('🟢 消息已删除');loadChat()}catch(e){show('删除失败：'+e.message,false)}}
async function loadBots(){try{const d=await req(api()+'/api/chat/bots'),a=Array.isArray(d.bots)?d.bots:[];$('botCount').textContent=a.length;$('botList').innerHTML=a.length?a.map(x=>`<div class=item><h3>${esc(x.avatar||'🤖')} ${esc(x.name||'Bot')}</h3><div class=meta>ID ${esc(x.id)}</div><div class=actions><button data-send-bot="${esc(x.id)}">发送消息</button><button class=danger data-del-bot="${esc(x.id)}">删除 Bot</button></div></div>`).join(''):'<div class=small style="margin-top:12px">暂无 Bot。</div>'}catch(e){show('加载 Bot 失败：'+e.message,false)}}async function addBot(){const name=$('botName').value.trim(),avatar=$('botAvatar').value.trim()||'🤖';if(!name)return show('请输入 Bot 名称。',false);try{await req(api()+'/api/admin/chat/bots',{method:'POST',headers:headers(),body:JSON.stringify({name,avatar})});show('🟢 Bot 创建成功');$('botName').value='';loadBots()}catch(e){show('创建失败：'+e.message,false)}}async function sendBot(id){const content=prompt('输入要发送到聊天室的 Bot 消息：');if(!content)return;try{await req(api()+'/api/admin/chat/bots/'+encodeURIComponent(id)+'/messages',{method:'POST',headers:headers(),body:JSON.stringify({content})});show('🟢 Bot 消息已发送');loadChat()}catch(e){show('发送失败：'+e.message,false)}}async function delBot(id){if(!confirm('确定删除这个 Bot 吗？'))return;try{await req(api()+'/api/admin/chat/bots/'+encodeURIComponent(id),{method:'DELETE',headers:headers()});show('🟢 Bot 已删除');loadBots()}catch(e){show('删除失败：'+e.message,false)}}async function all(){await test();await Promise.allSettled([loadNotice(),loadChat(),loadBots()]);show('检查完成')}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$('panel-'+b.dataset.tab).classList.add('active')});$('test').onclick=test;$('save').onclick=saveSettings;$('clearKey').onclick=()=>{localStorage.removeItem('ZEN_OS_CONSOLE_KEY');$('key').value='';show('已清除管理员密钥')};$('checkAll').onclick=all;$('refresh').onclick=all;$('loadNotice').onclick=loadNotice;$('publish').onclick=publish;$('clearNotice').onclick=()=>{$('title').value='';$('content').value='';$('pinned').checked=false;$('isNew').checked=true};$('loadChat').onclick=loadChat;$('loadBots').onclick=loadBots;$('addBot').onclick=addBot;
$('noticeList').addEventListener('click',e=>{const a=e.target.closest('[data-edit-ann]'),d=e.target.closest('[data-del-ann]');if(a)editAnn(a.dataset.editAnn);if(d)delAnn(d.dataset.delAnn)});$('chatList').addEventListener('click',e=>{const d=e.target.closest('[data-del-msg]');if(d)delMsg(d.dataset.delMsg)});$('botList').addEventListener('click',e=>{const s=e.target.closest('[data-send-bot]'),d=e.target.closest('[data-del-bot]');if(s)sendBot(s.dataset.sendBot);if(d)delBot(d.dataset.delBot)});loadSettings();
</script></body></html>
