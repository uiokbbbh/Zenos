<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<title>ZEN Chat</title>
<style>
:root{--bg:#080b14;--panel:rgba(20,27,48,.88);--panel2:rgba(127,127,127,.08);--text:#f4f6ff;--muted:#9da7c3;--border:rgba(255,255,255,.11);--accent:#6878ff;--accent2:#865fff;--danger:#ff6478;--ok:#7ee7a5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0%,rgba(104,120,255,.18),transparent 38%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}body{padding:12px}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{width:min(760px,100%);height:calc(100dvh - 24px);min-height:520px;margin:auto;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.32);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.header{display:flex;align-items:center;gap:10px;padding:14px 15px;border-bottom:1px solid var(--border);background:rgba(8,11,20,.35)}.back,.refresh,.adminBtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text)}.back{font-size:20px}.headText{flex:1;min-width:0}.title{font-weight:900;font-size:18px}.subtitle{font-size:12px;color:var(--muted);margin-top:2px}.status{font-size:11px;white-space:nowrap}.online{color:var(--ok)}.messages{flex:1;overflow-y:auto;padding:18px 14px 12px;scroll-behavior:smooth;overscroll-behavior:contain}.empty{text-align:center;color:var(--muted);padding:40px 20px}.msg{display:flex;gap:9px;margin:0 0 13px;align-items:flex-start}.avatar{width:38px;height:38px;min-width:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(104,120,255,.35),rgba(134,95,255,.25));border:1px solid var(--border);font-weight:900}.bubbleWrap{min-width:0;max-width:calc(100% - 48px)}.meta{font-size:11px;color:var(--muted);margin:1px 0 5px}.bubble{display:inline-block;max-width:100%;padding:10px 12px;border-radius:14px 16px 16px 5px;background:var(--panel2);border:1px solid var(--border);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.botBadge{display:inline-flex;margin-left:5px;padding:2px 6px;border-radius:999px;background:rgba(104,120,255,.18);color:#aeb8ff;border:1px solid rgba(104,120,255,.3);font-size:9px}.deleteMsg{margin-left:7px;border:0;background:transparent;color:#ff8796;font-size:11px;padding:2px 0;display:none}.adminMode .deleteMsg{display:inline}.composer{padding:11px 12px calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:rgba(8,11,20,.42)}.nick{display:flex;gap:8px;margin-bottom:8px}.nick input,.messageInput,.admin input{min-width:0;flex:1;border:1px solid var(--border);border-radius:13px;background:rgba(0,0,0,.16);color:var(--text);outline:none;padding:11px 12px}.nick input:focus,.messageInput:focus,.admin input:focus{border-color:rgba(104,120,255,.7);box-shadow:0 0 0 3px rgba(104,120,255,.1)}.nick span{font-size:11px;color:var(--muted);align-self:center;white-space:nowrap}.sendRow{display:flex;gap:8px}.messageInput{height:46px}.send{width:76px;border:0;border-radius:13px;color:#fff;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2))}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,15px);opacity:0;pointer-events:none;padding:10px 14px;border-radius:12px;background:#171d31;border:1px solid var(--border);font-size:13px;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.62);z-index:20}.modal[hidden]{display:none}.card{width:min(480px,100%);max-height:90dvh;overflow:auto;background:#11172a;border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.45)}.card h2{margin:0 0 7px;font-size:20px}.card p{margin:0 0 15px;color:var(--muted);font-size:13px}.card input{width:100%;border:1px solid var(--border);border-radius:13px;background:rgba(0,0,0,.18);color:var(--text);padding:12px;outline:none}.card button{width:100%;margin-top:11px;padding:12px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:900}.admin{display:grid;gap:10px}.adminRow{display:flex;gap:8px}.adminRow button{padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text)}.adminRow .primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:800}.adminRow .danger{color:#ff9aaa;border-color:rgba(255,100,120,.3)}.botList{display:grid;gap:8px;margin-top:5px}.botItem{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--border);border-radius:13px;background:var(--panel2)}.botItem .botName{flex:1}.botItem button{width:auto;margin:0;padding:7px 10px}.hint{font-size:11px;color:var(--muted);line-height:1.5}.adminSection{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}@media(max-width:600px){body{padding:0}.app{height:100dvh;min-height:0;border-radius:0;border-left:0;border-right:0}.messages{padding-left:11px;padding-right:11px}.status{font-size:10px}.adminBtn,.refresh,.back{width:38px;height:38px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="header">
<button class="back" id="back" type="button" aria-label="返回">‹</button>
<div class="headText"><div class="title">💬 ZEN Chat</div><div class="subtitle">公共聊天室 · ZEN OS</div></div>
<div class="status" id="status">● 连接中</div>
<button class="adminBtn" id="adminOpen" type="button" aria-label="管理">⚙</button>
<button class="refresh" id="refresh" type="button" aria-label="刷新">↻</button>
</header>
<main class="messages" id="messages"><div class="empty">正在加载聊天记录…</div></main>
<section class="composer"><div class="nick"><span>昵称</span><input id="name" maxlength="32" placeholder="输入你的昵称"></div><div class="sendRow"><input id="message" class="messageInput" maxlength="1000" placeholder="输入消息…"><button id="send" class="send" type="button">发送</button></div></section>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="nameModal"><div class="card"><h2>欢迎来到 ZEN Chat</h2><p>先设置一个昵称。昵称只保存在当前浏览器。</p><input id="nameFirst" maxlength="32" placeholder="例如：ZEN用户" autofocus><button id="enterChat" type="button">进入聊天室</button></div></div>
<div class="modal" id="adminModal" hidden><div class="card"><h2>🛠️ ZEN Chat 管理</h2><p>管理员密钥只用于本次浏览器会话，不会写入 localStorage。</p><div class="admin"><input id="adminKey" type="password" placeholder="输入 ADMIN_API_KEY"><div class="adminRow"><button class="primary" id="adminLogin">验证管理员</button><button id="adminClose">关闭</button></div><div id="adminPanel" hidden><div class="hint" id="adminState">管理员已验证。</div><div class="adminSection"><b>新增 Bot</b><div class="adminRow" style="margin-top:9px"><input id="botName" maxlength="32" placeholder="Bot 名称"><input id="botAvatar" maxlength="8" style="max-width:90px" placeholder="🤖"></div><button class="primary" id="addBot">添加 Bot</button></div><div class="adminSection"><b>Bot 发消息</b><select id="botSelect" style="width:100%;margin-top:9px;padding:11px;border-radius:13px;background:#11172a;color:#fff;border:1px solid var(--border)"></select><input id="botMessage" maxlength="1000" placeholder="输入 Bot 要发送的内容" style="margin-top:9px"><button class="primary" id="sendBot">发送 Bot 消息</button></div><div class="adminSection"><b>Bot 列表</b><div class="botList" id="botList"></div></div></div></div></div></div>
<script>
"use strict";
const API_BASE="https://zenos-91.onrender.com/api";
const POLL_MS=2500;
const PRESENCE_MS=20000;
const NAME_KEY="ZEN_CHAT_NAME";
const PRESENCE_KEY="ZEN_CHAT_PRESENCE_ID";
const ADMIN_KEY="ZEN_CHAT_ADMIN_SESSION";
const $=id=>document.getElementById(id);
const nameInput=$("name"),firstInput=$("nameFirst"),messageInput=$("message"),list=$("messages");
let timer=null,presenceTimer=null,firstLoad=true,lastSignature="",adminKey="",bots=[];
function toast(text){const el=$("toast");el.textContent=text;el.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),1800)}
function escapeHTML(v){return String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function formatTime(v){try{return new Date(v).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}catch{return ""}}
function avatarText(m){if(m&&m.isBot&&m.avatar)return escapeHTML(m.avatar);const s=String(m&&m.name||"Z").trim();return escapeHTML(s.slice(0,1).toUpperCase())}
function render(messages){const arr=Array.isArray(messages)?messages:[];const signature=arr.map(x=>String(x.id)).join("|")+":"+arr.length;if(signature===lastSignature&&!firstLoad)return;lastSignature=signature;if(!arr.length){list.innerHTML='<div class="empty">还没有消息，来发第一条吧 👋</div>';firstLoad=false;return}const nearBottom=list.scrollHeight-list.scrollTop-list.clientHeight<100;list.innerHTML=arr.map(m=>`<article class="msg"><div class="avatar">${avatarText(m)}</div><div class="bubbleWrap"><div class="meta">${escapeHTML(m.name||"ZEN用户")} ${m.isBot?'<span class="botBadge">BOT</span>':''} · ${escapeHTML(formatTime(m.date))}<button class="deleteMsg" data-delete="${escapeHTML(m.id)}" type="button">删除</button></div><div class="bubble">${escapeHTML(m.content)}</div></div></article>`).join("");if(firstLoad||nearBottom)list.scrollTop=list.scrollHeight;firstLoad=false}
async function getMessages(){try{const r=await fetch(API_BASE+"/chat/messages",{cache:"no-store",headers:{Accept:"application/json"}});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();render(d.messages);$("status").textContent="● 在线";$("status").className="status online"}catch(e){$("status").textContent="● 连接失败";$("status").className="status";if(firstLoad)list.innerHTML='<div class="empty">暂时无法连接聊天室。<br>请稍后重试。</div>'}}
function getPresenceId(){let id=localStorage.getItem(PRESENCE_KEY);if(!id){id="z"+Date.now().toString(36)+Math.random().toString(36).slice(2,10);localStorage.setItem(PRESENCE_KEY,id)}return id}
async function heartbeat(){try{const r=await fetch(API_BASE+"/chat/presence",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({clientId:getPresenceId()})});if(!r.ok)throw new Error();const d=await r.json();$("status").textContent="● "+(Number(d.onlineCount)||0)+" 人在线";$("status").className="status online"}catch(e){}}
async function sendMessage(){const name=nameInput.value.trim()||"ZEN用户",content=messageInput.value.trim();if(!content){messageInput.focus();return}const b=$("send");b.disabled=true;b.textContent="…";try{const r=await fetch(API_BASE+"/chat/messages",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({name,content})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||("HTTP "+r.status));localStorage.setItem(NAME_KEY,name);messageInput.value="";await getMessages();messageInput.focus()}catch(e){toast("发送失败："+e.message)}finally{b.disabled=false;b.textContent="发送"}}
function enter(){const name=firstInput.value.trim().slice(0,32)||"ZEN用户";localStorage.setItem(NAME_KEY,name);nameInput.value=name;$("nameModal").hidden=true;messageInput.focus();getMessages()}
async function api(path,options={}){const headers={Accept:"application/json",...(options.headers||{})};if(adminKey)headers.Authorization="Bearer "+adminKey;const r=await fetch(API_BASE+path,{...options,headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||("HTTP "+r.status));return d}
async function loadBots(){try{const d=await fetch(API_BASE+"/chat/bots",{cache:"no-store"}).then(r=>r.json());bots=Array.isArray(d.bots)?d.bots:[];const select=$("botSelect");select.innerHTML=bots.length?bots.map(b=>`<option value="${escapeHTML(b.id)}">${escapeHTML(b.avatar)} ${escapeHTML(b.name)}</option>`).join(""):"<option value="">暂无 Bot</option>";$("botList").innerHTML=bots.length?bots.map(b=>`<div class="botItem"><span>${escapeHTML(b.avatar)}</span><span class="botName">${escapeHTML(b.name)}</span><button class="danger" data-bot-delete="${escapeHTML(b.id)}" type="button">删除</button></div>`).join(""):"<div class=\"hint\">还没有 Bot。</div>"}catch(e){toast("读取 Bot 失败："+e.message)}}
async function loginAdmin(){const key=$("adminKey").value.trim();if(!key){toast("请输入管理员密钥");return}try{adminKey=key;await api("/chat/bots");$("adminPanel").hidden=false;$("adminState").textContent="管理员已验证，可以管理 Bot 和删除消息。";$("app").classList.add("adminMode");sessionStorage.setItem(ADMIN_KEY,"1");await loadBots();toast("管理员验证成功")}catch(e){adminKey="";$("adminPanel").hidden=true;toast("验证失败："+e.message)}}
async function addBot(){const name=$("botName").value.trim(),avatar=$("botAvatar").value.trim()||"🤖";if(!name){toast("请输入 Bot 名称");return}try{await api("/admin/chat/bots",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,avatar})});$("botName").value="";$("botAvatar").value="";await loadBots();toast("Bot 已添加")}catch(e){toast("添加失败："+e.message)}}
async function sendBot(){const id=$("botSelect").value,content=$("botMessage").value.trim();if(!id){toast("请先添加 Bot");return}if(!content){toast("请输入 Bot 消息");return}try{await api("/admin/chat/bots/"+encodeURIComponent(id)+"/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content})});$("botMessage").value="";await getMessages();toast("Bot 已发消息")}catch(e){toast("发送失败："+e.message)}}
async function deleteBot(id){if(!confirm("确定删除这个 Bot 吗？"))return;try{await api("/admin/chat/bots/"+encodeURIComponent(id),{method:"DELETE"});await loadBots();toast("Bot 已删除")}catch(e){toast("删除失败："+e.message)}}
async function deleteMessage(id){if(!adminKey||!confirm("确定删除这条消息吗？"))return;try{await api("/admin/chat/messages/"+encodeURIComponent(id),{method:"DELETE"});await getMessages();toast("消息已删除")}catch(e){toast("删除失败："+e.message)}}
function start(){const saved=localStorage.getItem(NAME_KEY)||"";if(saved){nameInput.value=saved;firstInput.value=saved;$("nameModal").hidden=true}else $("nameModal").hidden=false;adminKey="";getMessages();heartbeat();timer=setInterval(getMessages,POLL_MS);presenceTimer=setInterval(heartbeat,PRESENCE_MS)}
$("send").addEventListener("click",sendMessage);$("refresh").addEventListener("click",()=>{toast("正在刷新…");getMessages();heartbeat()});$("enterChat").addEventListener("click",enter);$("adminOpen").addEventListener("click",()=>{$("adminModal").hidden=false});$("adminClose").addEventListener("click",()=>{$("adminModal").hidden=true});$("adminLogin").addEventListener("click",loginAdmin);$("addBot").addEventListener("click",addBot);$("sendBot").addEventListener("click",sendBot);$("botList").addEventListener("click",e=>{const b=e.target.closest("[data-bot-delete]");if(b)deleteBot(b.dataset.botDelete)});list.addEventListener("click",e=>{const b=e.target.closest("[data-delete]");if(b)deleteMessage(b.dataset.delete)});$("back").addEventListener("click",()=>{if(history.length>1)history.back();else location.href="./"});messageInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});nameInput.addEventListener("change",()=>{const name=nameInput.value.trim().slice(0,32)||"ZEN用户";nameInput.value=name;localStorage.setItem(NAME_KEY,name)});firstInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();enter()}});window.addEventListener("online",()=>{getMessages();heartbeat()});window.addEventListener("offline",()=>{$("status").textContent="● 离线";$('status').className="status"});start();
</script>
</body>
</html>
