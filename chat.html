<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<title>ZEN Chat</title>
<style>
:root{
  --bg:#080b14;
  --panel:rgba(20,27,48,.82);
  --panel2:rgba(127,127,127,.08);
  --text:#f4f6ff;
  --muted:#9da7c3;
  --border:rgba(255,255,255,.11);
  --accent:#6878ff;
  --accent2:#865fff;
  --danger:#ff6478;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0%,rgba(104,120,255,.18),transparent 38%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
body{padding:12px}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.app{width:min(720px,100%);height:calc(100dvh - 24px);min-height:520px;margin:auto;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.32);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.header{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--border);background:rgba(8,11,20,.35)}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:20px}
.headText{flex:1;min-width:0}
.title{font-weight:900;font-size:18px}
.subtitle{font-size:12px;color:var(--muted);margin-top:2px}
.status{font-size:11px;color:#7ee7a5;white-space:nowrap}
.messages{flex:1;overflow-y:auto;padding:18px 14px 12px;scroll-behavior:smooth;overscroll-behavior:contain}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.msg{display:flex;gap:9px;margin:0 0 13px;align-items:flex-start}
.avatar{width:38px;height:38px;min-width:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(104,120,255,.35),rgba(134,95,255,.25));border:1px solid var(--border);font-weight:900}
.bubbleWrap{min-width:0;max-width:calc(100% - 48px)}
.meta{font-size:11px;color:var(--muted);margin:1px 0 5px}
.bubble{display:inline-block;max-width:100%;padding:10px 12px;border-radius:14px 16px 16px 5px;background:var(--panel2);border:1px solid var(--border);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.composer{padding:11px 12px calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:rgba(8,11,20,.42)}
.nick{display:flex;gap:8px;margin-bottom:8px}
.nick input,.messageInput{min-width:0;flex:1;border:1px solid var(--border);border-radius:13px;background:rgba(0,0,0,.16);color:var(--text);outline:none;padding:11px 12px}
.nick input:focus,.messageInput:focus{border-color:rgba(104,120,255,.7);box-shadow:0 0 0 3px rgba(104,120,255,.1)}
.nick span{font-size:11px;color:var(--muted);align-self:center;white-space:nowrap}
.sendRow{display:flex;gap:8px}
.messageInput{height:46px;resize:none}
.send{width:76px;border:0;border-radius:13px;color:#fff;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.refresh{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,15px);opacity:0;pointer-events:none;padding:10px 14px;border-radius:12px;background:#171d31;border:1px solid var(--border);font-size:13px;transition:.2s;z-index:5}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55);z-index:10}
.modal[hidden]{display:none}
.card{width:min(420px,100%);background:#11172a;border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.card h2{margin:0 0 7px;font-size:20px}.card p{margin:0 0 15px;color:var(--muted);font-size:13px}
.card input{width:100%;border:1px solid var(--border);border-radius:13px;background:rgba(0,0,0,.18);color:var(--text);padding:12px;outline:none}
.card button{width:100%;margin-top:11px;padding:12px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:900}
@media(max-width:600px){
  body{padding:0}
  .app{height:100dvh;min-height:0;border-radius:0;border-left:0;border-right:0}
  .messages{padding-left:11px;padding-right:11px}
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <button class="back" id="back" type="button" aria-label="返回">‹</button>
    <div class="headText">
      <div class="title">💬 ZEN Chat</div>
      <div class="subtitle">公共聊天室 · ZEN OS</div>
    </div>
    <div class="status" id="status">● 在线</div>
    <button class="refresh" id="refresh" type="button" aria-label="刷新">↻</button>
  </header>

  <main class="messages" id="messages">
    <div class="empty">正在加载聊天记录…</div>
  </main>

  <section class="composer">
    <div class="nick">
      <span>昵称</span>
      <input id="name" maxlength="32" placeholder="输入你的昵称">
    </div>
    <div class="sendRow">
      <input id="message" class="messageInput" maxlength="1000" placeholder="输入消息…">
      <button id="send" class="send" type="button">发送</button>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="nameModal">
  <div class="card">
    <h2>欢迎来到 ZEN Chat</h2>
    <p>先设置一个昵称。昵称只保存在当前浏览器。</p>
    <input id="nameFirst" maxlength="32" placeholder="例如：ZEN用户" autofocus>
    <button id="enterChat" type="button" onclick="window.ZENEnterChat && window.ZENEnterChat()">进入聊天室</button>
  </div>
</div>

<script>
"use strict";

const API_BASE = "https://zenos-91.onrender.com/api";
const POLL_MS = 2500;
const NAME_KEY = "ZEN_CHAT_NAME";

function safeGetName(){
  try { return localStorage.getItem(NAME_KEY) || ""; }
  catch { return ""; }
}

function safeSetName(name){
  try { safeSetName(name); }
  catch {}
}

const $ = id => document.getElementById(id);
const nameInput = $("name");
const firstInput = $("nameFirst");
const messageInput = $("message");
const list = $("messages");

let timer = null;
let firstLoad = true;
let lastSignature = "";

function toast(text){
  const el = $("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), 1800);
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[ch]));
}

function formatTime(value){
  try{
    return new Date(value).toLocaleTimeString("zh-CN", {
      hour:"2-digit",
      minute:"2-digit"
    });
  }catch{
    return "";
  }
}

function avatarText(name){
  const s = String(name || "Z").trim();
  return escapeHTML(s.slice(0,1).toUpperCase());
}

function render(messages){
  const arr = Array.isArray(messages) ? messages : [];
  const signature = arr.map(x => String(x.id)).join("|") + ":" + arr.length;

  if(signature === lastSignature && !firstLoad) return;
  lastSignature = signature;

  if(!arr.length){
    list.innerHTML = '<div class="empty">还没有消息，来发第一条吧 👋</div>';
    firstLoad = false;
    return;
  }

  const nearBottom =
    list.scrollHeight - list.scrollTop - list.clientHeight < 100;

  list.innerHTML = arr.map(m => `
    <article class="msg">
      <div class="avatar">${avatarText(m.name)}</div>
      <div class="bubbleWrap">
        <div class="meta">${escapeHTML(m.name || "ZEN用户")} · ${escapeHTML(formatTime(m.date))}</div>
        <div class="bubble">${escapeHTML(m.content)}</div>
      </div>
    </article>
  `).join("");

  if(firstLoad || nearBottom){
    list.scrollTop = list.scrollHeight;
  }

  firstLoad = false;
}

async function getMessages(){
  try{
    const response = await fetch(API_BASE + "/chat/messages", {
      cache:"no-store",
      headers:{Accept:"application/json"}
    });

    if(!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();
    render(data.messages);
    $("status").textContent = "● 在线";
    $("status").style.color = "#7ee7a5";
  }catch(error){
    $("status").textContent = "● 连接失败";
    $("status").style.color = "#ff8b9a";

    if(firstLoad){
      list.innerHTML =
        '<div class="empty">暂时无法连接聊天室。<br>请稍后重试。</div>';
    }
  }
}

async function sendMessage(){
  const name = nameInput.value.trim() || "ZEN用户";
  const content = messageInput.value.trim();

  if(!content){
    messageInput.focus();
    return;
  }

  const button = $("send");
  button.disabled = true;
  button.textContent = "…";

  try{
    const response = await fetch(API_BASE + "/chat/messages", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Accept":"application/json"
      },
      body:JSON.stringify({name,content})
    });

    const data = await response.json().catch(() => ({}));

    if(!response.ok){
      throw new Error(data.error || ("HTTP " + response.status));
    }

    safeSetName(name);
    messageInput.value = "";
    await getMessages();
    messageInput.focus();
  }catch(error){
    toast("发送失败：" + error.message);
  }finally{
    button.disabled = false;
    button.textContent = "发送";
  }
}

function enter(){
  const name = String(firstInput.value || "").trim().slice(0,32) || "ZEN用户";
  safeSetName(name);
  nameInput.value = name;
  firstInput.value = name;
  const modal = $("nameModal");
  modal.hidden = true;
  modal.style.display = "none";
  document.body.classList.remove("chat-lock");
  setTimeout(() => messageInput.focus(), 0);
  getMessages();
}

// Global fallback for mobile browsers / cached inline handlers.
window.ZENEnterChat = enter;

function start(){
  const saved = safeGetName();
  const modal = $("nameModal");

  if(saved){
    nameInput.value = saved;
    firstInput.value = saved;
    modal.hidden = true;
    modal.style.display = "none";
  }else{
    modal.hidden = false;
    modal.style.display = "grid";
  }

  getMessages();
  timer = setInterval(getMessages, POLL_MS);
}

$("send").addEventListener("click", sendMessage);
$("refresh").addEventListener("click", () => {
  toast("正在刷新…");
  getMessages();
});
$("enterChat").addEventListener("click", event => {
  event.preventDefault();
  event.stopPropagation();
  enter();
}, true);
$("back").addEventListener("click", () => {
  if(history.length > 1) history.back();
  else location.href = "./";
});

messageInput.addEventListener("keydown", event => {
  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
});

nameInput.addEventListener("change", () => {
  const name = nameInput.value.trim().slice(0,32) || "ZEN用户";
  nameInput.value = name;
  safeSetName(name);
});

firstInput.addEventListener("keydown", event => {
  if(event.key === "Enter"){
    event.preventDefault();
    enter();
  }
});

window.addEventListener("online", getMessages);
window.addEventListener("offline", () => {
  $("status").textContent = "● 离线";
  $("status").style.color = "#ff8b9a";
});

start();
</script>
</body>
</html>
