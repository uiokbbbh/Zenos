<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZEN AI · 已关闭</title>
<style>
:root{color-scheme:dark;--bg:#080a0f;--panel:#10141c;--line:#27303d;--text:#f3f6fb;--muted:#8f9aaa;--accent:#7dd3fc}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at 50% -10%,#17202e 0,#080a0f 48%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center;align-items:center;padding:20px}.app{width:100%;max-width:720px}.card{background:rgba(16,20,28,.94);border:1px solid var(--line);border-radius:24px;padding:34px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.icon{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#202c3b,#111721);border:1px solid #334154;font-size:36px;filter:grayscale(.5)}
h1{margin:0 0 10px;font-size:28px}.status{display:inline-block;padding:6px 10px;border-radius:999px;background:#25171a;border:1px solid #553037;color:#fca5a5;font-size:13px;margin-bottom:18px}.desc{color:var(--muted);line-height:1.8;margin:0 auto 24px;max-width:520px}.back{display:inline-block;text-decoration:none;color:#061018;background:var(--accent);padding:11px 18px;border-radius:12px;font-weight:700}
</style>
</head>
<body>
<div class="app"><section class="card">
  <div class="icon">🤖</div>
  <h1>ZEN AI</h1>
  <div class="status">服务已关闭</div>
  <p class="desc">ZEN AI 独立智能助手目前已停止提供 AI 对话服务。<br>ZEN OS 网站、聊天室及其他非 AI 功能不受影响。</p>
  <a class="back" href="./index.html">返回 ZEN OS</a>
</section></div>
</body>
</html>
