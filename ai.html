<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<title>ZEN AI V2</title>
<style>
:root{color-scheme:dark;--bg:#080a0f;--panel:#10141c;--panel2:#151b25;--line:#27303d;--text:#f3f6fb;--muted:#8f9aaa;--accent:#7dd3fc;--accent2:#8b5cf6;--danger:#fca5a5}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at 50% -10%,#17202e 0,#080a0f 48%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{display:flex;justify-content:center}.app{width:100%;max-width:1000px;height:100dvh;display:flex;flex-direction:column}
header{height:64px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(8,10,15,.82);backdrop-filter:blur(18px);position:sticky;top:0;z-index:5}
button{font:inherit}.iconBtn,.clear{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;cursor:pointer}
.iconBtn{width:40px;height:40px;font-size:18px}.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.avatar{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#202c3b,#111721);border:1px solid #334154;font-size:21px}.title{font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:7px}.clear{padding:9px 11px;color:var(--muted)}
.messages{flex:1;overflow:auto;padding:22px 15px 140px}.welcome{max-width:720px;margin:12vh auto 0;text-align:center}.welcome .big{font-size:58px}.welcome h1{margin:12px 0 8px;font-size:32px}.welcome p{color:var(--muted);line-height:1.75}.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}.suggestions button{padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);color:var(--muted);cursor:pointer}
.msg{display:flex;gap:9px;margin:18px auto;max-width:820px}.msg.user{justify-content:flex-end}.msgWrap{max-width:min(84%,760px)}.bubble{padding:13px 15px;border:1px solid var(--line);border-radius:17px;line-height:1.7;overflow-wrap:anywhere;box-shadow:0 7px 24px rgba(0,0,0,.08)}.user .bubble{background:#17202c;border-color:#2b3949}.ai .bubble{background:var(--panel)}.mini{font-size:10px;color:var(--muted);margin:4px 5px}.msg.user .mini{text-align:right}
.bubble p{margin:0 0 9px}.bubble p:last-child{margin-bottom:0}.bubble pre{overflow:auto;padding:12px;border-radius:11px;background:#080b11;border:1px solid var(--line)}.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.bubble :not(pre)>code{padding:2px 5px;border-radius:5px;background:rgba(255,255,255,.08)}.bubble ul{margin:8px 0;padding-left:22px}.bubble h1,.bubble h2,.bubble h3{margin:8px 0}.bubble blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--accent);color:var(--muted)}
.msgTools{display:flex;gap:5px;margin:4px 3px}.msgTools button{border:0;background:transparent;color:var(--muted);font-size:11px;cursor:pointer}.typing{color:var(--muted);font-style:italic}.error{color:var(--danger)}
.composer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(8,10,15,.97) 25%);z-index:4}.bar{width:100%;max-width:1000px;display:flex;gap:8px;padding:8px;border:1px solid var(--line);background:rgba(16,20,28,.97);border-radius:18px}.input{flex:1;border:0;outline:0;background:transparent;color:var(--text);padding:10px 8px;font-size:15px;resize:none;max-height:150px}.send{width:48px;height:48px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--accent),#60a5fa);color:#061018;font-weight:900;cursor:pointer}.send:disabled{opacity:.45}
.drawer{position:fixed;inset:0;display:none;z-index:20;background:rgba(0,0,0,.62);backdrop-filter:blur(7px)}.drawer.show{display:flex;justify-content:flex-end}.drawerBox{width:min(420px,92vw);height:100%;overflow:auto;background:var(--panel2);border-left:1px solid var(--line);padding:18px}.drawerHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.drawerHead h2{margin:0}.section{padding:15px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025);margin-bottom:12px}.sectionTitle{font-weight:800;margin-bottom:8px}.muted{color:var(--muted);font-size:12px;line-height:1.6}.memory{padding:10px;border:1px solid var(--line);border-radius:12px;margin:7px 0}.memoryTop{display:flex;gap:8px;align-items:center}.memoryText{flex:1;line-height:1.5}.dangerBtn{border:0;background:transparent;color:#fca5a5;cursor:pointer}.input2,.textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;outline:none;background:rgba(0,0,0,.16);color:var(--text);margin-top:7px}.textarea{min-height:110px;resize:vertical}.btn{padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.05);color:var(--text);cursor:pointer}.btn.primary{border-color:transparent;background:linear-gradient(135deg,#6878ff,#865fff);color:#fff}.row{display:flex;gap:8px}.row>*{flex:1}
@media(max-width:600px){header{height:58px;padding:0 9px}.actions .admin{display:none}.clear{font-size:11px}.messages{padding-left:9px;padding-right:9px}.msgWrap{max-width:90%}.bubble{padding:12px 13px}.sub{max-width:180px}.welcome{margin-top:9vh}}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="iconBtn" id="back" aria-label="返回">‹</button>
  <div class="brand"><div class="avatar" id="avatar">🤖</div><div><div class="title" id="title">ZEN AI</div><div class="sub" id="sub">ZEN OS 独立智能助手 · 在线</div></div></div>
  <div class="actions">
    <button class="iconBtn admin" id="admin" title="管理">⚙</button>
    <button class="iconBtn" id="memoryBtn" title="记忆">🧠</button>
    <button class="iconBtn" id="newChat" title="新对话">＋</button>
    <button class="clear" id="clear">清空</button>
  </div>
</header>
<main class="messages" id="messages">
<section class="welcome" id="welcome">
  <div class="big">🤖</div><h1>ZEN AI</h1>
  <p>独立于 ZEN Chat 的系统智能助手。<br>我可以陪你聊天、解决问题，也可以记住你主动告诉我的事情。</p>
  <div class="suggestions">
    <button data-suggest="给我讲一个很离谱但有科学依据的故事">来点离谱的</button>
    <button data-suggest="帮我设计一个很酷的 ZEN OS 功能">设计新功能</button>
    <button data-suggest="你现在最想吐槽 ZEN OS 的哪个地方？">让 AI 吐槽</button>
  </div>
</section>
</main>
<div class="composer"><div class="bar">
  <textarea id="input" class="input" rows="1" placeholder="和 ZEN AI 说点什么…"></textarea>
  <button id="send" class="send">↑</button>
</div></div>
</div>

<div class="drawer" id="drawer">
  <div class="drawerBox">
    <div class="drawerHead"><h2 id="drawerTitle">🧠 ZEN AI 记忆</h2><button class="iconBtn" id="drawerClose">×</button></div>
    <div class="section">
      <div class="sectionTitle">主动记住一件事</div>
      <div class="muted">例如：“我喜欢深色界面”。这会保存到当前设备对应的 ZEN 用户记忆。</div>
      <input class="input2" id="memoryInput" placeholder="输入要记住的内容">
      <button class="btn primary" id="saveMemory" style="width:100%;margin-top:8px">保存记忆</button>
    </div>
    <div class="section">
      <div class="sectionTitle">已有记忆</div>
      <div id="memoryList"></div>
      <button class="btn dangerBtn" id="clearMemory" style="width:100%;margin-top:8px">清空全部记忆</button>
    </div>
    <div class="section">
      <div class="sectionTitle">当前 AI</div>
      <div class="muted" id="configPreview">正在读取……</div>
    </div>
  </div>
</div>

<script>
const API_BASE = "https://zenos-91.onrender.com/api";
const API = API_BASE + "/ai/chat";
const USER_KEY = "zen_os_ai_user_id";
const HISTORY_KEY = "zen_ai_v2_history";

const $ = id => document.getElementById(id);
let history = [];
let config = {name:"ZEN AI",avatar:"🤖"};
let sending = false;

function userId(){
  let id = localStorage.getItem(USER_KEY);
  if(!id){
    id = "u_" + crypto.randomUUID().replaceAll("-","");
    localStorage.setItem(USER_KEY,id);
  }
  return id;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function md(s){
  const lines=String(s).split("\n"), out=[]; let inCode=false, code=[];
  for(const raw of lines){
    const line=raw;
    if(line.trim().startsWith("```")){
      if(inCode){out.push("<pre><code>"+esc(code.join("\n"))+"</code></pre>");code=[];inCode=false}
      else inCode=true;
      continue;
    }
    if(inCode){code.push(line);continue}
    if(/^### /.test(line)){out.push("<h3>"+inlineMd(line.slice(4))+"</h3>");continue}
    if(/^## /.test(line)){out.push("<h2>"+inlineMd(line.slice(3))+"</h2>");continue}
    if(/^# /.test(line)){out.push("<h1>"+inlineMd(line.slice(2))+"</h1>");continue}
    if(/^> /.test(line)){out.push("<blockquote>"+inlineMd(line.slice(2))+"</blockquote>");continue}
    if(/^[-*] /.test(line)){out.push("<li>"+inlineMd(line.slice(2))+"</li>");continue}
    out.push(line===""?"":inlineMd(line));
  }
  if(inCode)out.push("<pre><code>"+esc(code.join("\n"))+"</code></pre>");
  let html="",list=false;
  for(const item of out){
    if(item.startsWith("<li>")){if(!list){html+="<ul>";list=true}html+=item;continue}
    if(list){html+="</ul>";list=false}
    html+=item===""?"<br>":"<div>"+item+"</div>";
  }
  if(list)html+="</ul>";
  return html;
}
function inlineMd(s){
  let x=esc(s);
  x=x.replace(/`([^`]+)`/g,"<code>$1</code>");
  x=x.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  x=x.replace(/\*([^*]+)\*/g,"<em>$1</em>");
  return x;
}
function save(){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(-100)))}catch{}}
function load(){try{history=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");if(!Array.isArray(history))history=[]}catch{history=[]}history.forEach(m=>renderMessage(m.role,m.content,false))}
function renderMessage(role,text,tools=true,typing=false){
  $("welcome")?.remove();
  const row=document.createElement("div");row.className="msg "+(role==="user"?"user":"ai");
  const wrap=document.createElement("div");wrap.className="msgWrap";
  const bubble=document.createElement("div");bubble.className="bubble"+(typing?" typing":"");bubble.innerHTML=role==="assistant"?md(text):esc(text).replace(/\n/g,"<br>");
  const mini=document.createElement("div");mini.className="mini";mini.textContent=role==="user"?"你":config.name;
  wrap.appendChild(bubble);wrap.appendChild(mini);
  if(role==="assistant"&&tools){
    const bar=document.createElement("div");bar.className="msgTools";
    const copy=document.createElement("button");copy.textContent="复制";copy.onclick=()=>navigator.clipboard?.writeText(text);
    const regen=document.createElement("button");regen.textContent="重新生成";regen.onclick=()=>regenerate(row);
    bar.append(copy,regen);wrap.appendChild(bar);
  }
  row.appendChild(wrap);$("messages").appendChild(row);$("messages").scrollTop=$("messages").scrollHeight;return row;
}
function addTyping(){return renderMessage("assistant","ZEN AI 正在思考……",false,true)}
async function loadConfig(){
  try{const r=await fetch(API_BASE+"/ai/config",{cache:"no-store"});const d=await r.json();if(d.ok){config=d;$("title").textContent=d.name;$("avatar").textContent=d.avatar;$("sub").textContent="ZEN OS 独立智能助手 · 在线";$("configPreview").textContent=d.persona||"已加载自定义人设";}}catch{}
}
async function send(textOverride,appendUser=true){
  if(sending)return;
  const input=$("input");const text=String(textOverride??input.value).trim();if(!text)return;
  input.value="";input.style.height="auto";
  if(appendUser){renderMessage("user",text);history.push({role:"user",content:text});save();}
  sending=true;$("send").disabled=true;const typing=addTyping();
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","X-ZEN-User":userId()},body:JSON.stringify({userId:userId(),name:"ZEN用户",content:text,messages:history.slice(-20)})});
    const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||("HTTP "+r.status));
    const reply=String(data.reply||data.content||data.message?.content||"").trim();if(!reply)throw new Error("AI 没有返回内容");
    typing.remove();renderMessage("assistant",reply);history.push({role:"assistant",content:reply});save();
  }catch(e){const bubble=typing.querySelector(".bubble");bubble.classList.remove("typing");bubble.classList.add("error");bubble.textContent="AI 请求失败："+e.message}
  finally{sending=false;$("send").disabled=false;input.focus()}
}
async function regenerate(row){
  const idx=[...$("messages").children].indexOf(row);row.remove();
  let lastUser=-1;for(let i=history.length-1;i>=0;i--){if(history[i].role==="user"){lastUser=i;break}}
  if(lastUser<0)return;
  history=history.slice(0,lastUser+1);save();await send(history[lastUser].content,false);
}
async function refreshMemory(){
  const box=$("memoryList");box.innerHTML='<div class="muted">读取中……</div>';
  try{
    const r=await fetch(API_BASE+"/ai/memory?userId="+encodeURIComponent(userId()),{cache:"no-store"});const d=await r.json();
    if(!d.memories?.length){box.innerHTML='<div class="muted">暂时没有长期记忆。</div>';return}
    box.innerHTML="";
    d.memories.forEach(m=>{const div=document.createElement("div");div.className="memory";div.innerHTML='<div class="memoryTop"><div class="memoryText"></div><button class="dangerBtn">删除</button></div>';div.querySelector(".memoryText").textContent=m.text;div.querySelector("button").onclick=()=>deleteMemory(m.id);box.appendChild(div)})
  }catch{box.innerHTML='<div class="muted">记忆服务暂时不可用。</div>'}
}
async function deleteMemory(id){
  await fetch(API_BASE+"/ai/memory/"+encodeURIComponent(id)+"?userId="+encodeURIComponent(userId()),{method:"DELETE",headers:{"X-ZEN-User":userId()}});
  refreshMemory();
}
$("saveMemory").onclick=async()=>{const text=$("memoryInput").value.trim();if(!text)return;const r=await fetch(API_BASE+"/ai/memory",{method:"POST",headers:{"Content-Type":"application/json","X-ZEN-User":userId()},body:JSON.stringify({userId:userId(),text})});if(r.ok){$("memoryInput").value="";refreshMemory()}};
$("clearMemory").onclick=async()=>{if(!confirm("确定清空这个 ZEN 用户的全部长期记忆？"))return;await fetch(API_BASE+"/ai/memory?userId="+encodeURIComponent(userId()),{method:"DELETE",headers:{"X-ZEN-User":userId()}});refreshMemory()};
$("memoryBtn").onclick=()=>{$("drawer").classList.add("show");refreshMemory()};
$("drawerClose").onclick=()=>$("drawer").classList.remove("show");
$("drawer").onclick=e=>{if(e.target===$("drawer"))$("drawer").classList.remove("show")};
$("admin").onclick=()=>location.href="./ai_admin.html";
$("newChat").onclick=()=>{if(history.length&&!confirm("开始新对话？当前对话会保留在本设备历史里。"))return;history=[];localStorage.removeItem(HISTORY_KEY);$("messages").innerHTML='<section class="welcome" id="welcome"><div class="big">🤖</div><h1>ZEN AI</h1><p>新对话已准备好。</p></section>'};
$("clear").onclick=()=>{if(!confirm("清空当前对话？"))return;history=[];localStorage.removeItem(HISTORY_KEY);$("messages").innerHTML='<section class="welcome" id="welcome"><div class="big">🤖</div><h1>ZEN AI</h1><p>对话已清空。系统重新上线。</p></section>'};
$("back").onclick=()=>location.href="./index.html";
$("send").onclick=()=>send();
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("input").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,150)+"px"});
document.addEventListener("click",e=>{const b=e.target.closest("[data-suggest]");if(b)send(b.dataset.suggest)});
loadConfig();load();
</script>
</body>
</html>
