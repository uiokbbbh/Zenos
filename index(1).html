<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<meta name="color-scheme" content="dark light">
<title>ZEN OS V19</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#080b14;
  --bg2:#0d1220;
  --panel:rgba(18,24,39,.82);
  --panel2:rgba(25,32,50,.92);
  --border:rgba(255,255,255,.09);
  --text:#f4f7ff;
  --muted:#8993a8;
  --accent:#6d7cff;
  --accent2:#8f98ff;
  --danger:#ff5d73;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}

body.light{
  --bg:#edf1f8;
  --bg2:#e5eaf3;
  --panel:rgba(255,255,255,.82);
  --panel2:rgba(255,255,255,.96);
  --border:rgba(20,30,50,.10);
  --text:#172033;
  --muted:#687286;
  --shadow:0 20px 60px rgba(60,70,100,.16);
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

body{
  position:relative;
}

body:before{
  content:"";
  position:fixed;
  inset:-20%;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 20%,rgba(93,111,255,.16),transparent 30%),
    radial-gradient(circle at 80% 70%,rgba(0,220,255,.08),transparent 30%);
  z-index:-2;
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:linear-gradient(to bottom,transparent,#000,transparent);
  z-index:-1;
}

/* =========================
   LOCK
========================= */

#lock{
  position:fixed;
  inset:0;
  z-index:999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 25%,rgba(100,120,255,.18),transparent 35%),
    var(--bg);
}

.lockBox{
  width:min(420px,100%);
  padding:38px 28px;
  border:1px solid var(--border);
  background:var(--panel);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border-radius:30px;
  box-shadow:var(--shadow);
  text-align:center;
}

.lockLogo{
  width:82px;
  height:82px;
  margin:0 auto 20px;
  border-radius:24px;
  display:grid;
  place-items:center;
  font-size:42px;
  font-weight:900;
  color:white;
  background:linear-gradient(135deg,#6675ff,#8c5cff);
  box-shadow:0 15px 40px rgba(100,110,255,.35);
}

#lockTime{
  font-size:42px;
  font-weight:900;
  letter-spacing:-2px;
}

#lockDate{
  margin-top:5px;
  color:var(--muted);
}

.pinInput{
  width:100%;
  margin-top:24px;
  padding:15px;
  border:1px solid var(--border);
  border-radius:15px;
  background:rgba(0,0,0,.12);
  color:var(--text);
  outline:none;
  text-align:center;
  letter-spacing:8px;
}

.lockButtons{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.lockButtons .btn{
  flex:1;
}

/* =========================
   APP
========================= */

#app{
  display:none;
  width:100%;
  height:100%;
  flex-direction:column;
}

.topbar{
  height:66px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid var(--border);
  background:rgba(8,11,20,.48);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

body.light .topbar{
  background:rgba(255,255,255,.55);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
}

.brandLogo{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:linear-gradient(135deg,#6675ff,#8d5cff);
  color:white;
}

.topRight{
  display:flex;
  align-items:center;
  gap:10px;
}

.topTime{
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}

.iconBtn{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel);
  color:var(--text);
}

.desktop{
  flex:1;
  overflow:auto;
  padding:28px;
  padding-bottom:110px;
}

.hero{
  max-width:1250px;
  margin:0 auto 25px;
  display:grid;
  grid-template-columns:1.5fr .7fr;
  gap:18px;
}

.heroCard{
  min-height:220px;
  padding:30px;
  border:1px solid var(--border);
  border-radius:28px;
  background:var(--panel);
  backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}

.heroCard h1{
  margin:0;
  font-size:clamp(36px,6vw,70px);
  letter-spacing:-3px;
}

.heroSub{
  margin-top:5px;
  color:var(--muted);
}

.heroTime{
  margin-top:38px;
  font-size:clamp(36px,6vw,65px);
  font-weight:900;
  letter-spacing:-3px;
  font-variant-numeric:tabular-nums;
}

.heroDate{
  color:var(--muted);
}

.statusCard{
  min-height:220px;
  padding:25px;
  border:1px solid var(--border);
  border-radius:28px;
  background:var(--panel);
  box-shadow:var(--shadow);
}

.statusTitle{
  color:var(--muted);
  font-size:13px;
}

.statusMain{
  margin-top:18px;
  font-size:25px;
  font-weight:900;
}

.statusLine{
  margin-top:12px;
  color:var(--muted);
}

/* =========================
   APPS
========================= */

.appGrid{
  max-width:1250px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.appCard{
  min-height:135px;
  padding:20px;
  border:1px solid var(--border);
  border-radius:22px;
  background:var(--panel);
  color:var(--text);
  text-align:left;
  transition:.2s;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.appCard:hover{
  transform:translateY(-4px);
  border-color:rgba(120,130,255,.4);
}

.appIcon{
  font-size:30px;
  margin-bottom:18px;
}

.appName{
  font-weight:900;
}

.appDesc{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

/* =========================
   DOCK
========================= */

.dock{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  padding:9px;
  border:1px solid var(--border);
  border-radius:22px;
  background:rgba(12,16,28,.72);
  backdrop-filter:blur(25px);
  box-shadow:var(--shadow);
  z-index:50;
}

body.light .dock{
  background:rgba(255,255,255,.8);
}

.dock button{
  width:45px;
  height:45px;
  border:0;
  border-radius:14px;
  background:transparent;
  color:var(--text);
  font-size:20px;
}

.dock button:hover{
  background:rgba(120,130,255,.16);
}

/* =========================
   MODAL
========================= */

#modal{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(7px);
}

#modal.show{
  display:flex;
}

.modalBox{
  width:min(720px,100%);
  max-height:min(86vh,900px);
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:26px;
  background:var(--panel2);
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
}

.modalHead{
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 22px;
  border-bottom:1px solid var(--border);
}

.modalHead h2{
  margin:0;
  font-size:20px;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:12px;
  background:rgba(127,127,127,.12);
  color:var(--text);
  font-size:25px;
}

.modalBody{
  padding:20px;
  overflow:auto;
}

.section{
  margin-bottom:14px;
  padding:17px;
  border:1px solid var(--border);
  border-radius:18px;
  background:rgba(127,127,127,.045);
}

.sectionTitle{
  margin-bottom:10px;
  font-weight:800;
}

.muted{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.row{
  display:flex;
  gap:10px;
}

.row>*{
  flex:1;
}

/* =========================
   BUTTONS / INPUT
========================= */

.btn{
  padding:11px 15px;
  border:1px solid var(--border);
  border-radius:13px;
  background:rgba(127,127,127,.09);
  color:var(--text);
}

.btn:hover{
  background:rgba(127,127,127,.16);
}

.btn.primary{
  border-color:transparent;
  color:white;
  background:linear-gradient(135deg,#6878ff,#865fff);
}

.btn.danger{
  color:#ff7080;
}

.input,
select,
textarea{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:13px;
  outline:none;
  background:rgba(127,127,127,.08);
  color:var(--text);
}

textarea{
  min-height:130px;
  resize:vertical;
}

select option{
  background:#151b2a;
  color:#fff;
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translate(-50%,20px);
  padding:12px 18px;
  border:1px solid var(--border);
  border-radius:14px;
  background:rgba(20,25,40,.92);
  color:#fff;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:9999;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   FLOAT
========================= */

#floatTextLayer{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:20;
}

.floatText{
  position:absolute;
  color:rgba(140,155,255,.55);
  font-weight:800;
  animation:floatMove linear forwards;
  text-shadow:0 0 15px rgba(100,120,255,.4);
  pointer-events:none;
}

@keyframes floatMove{
  0%{
    opacity:0;
    transform:translateY(30px);
  }
  15%{
    opacity:.8;
  }
  80%{
    opacity:.4;
  }
  100%{
    opacity:0;
    transform:translateY(-120px);
  }
}

/* =========================
   FLOAT ENGINE V4
========================= */
.floatText{
  --float-opacity:.55;
  max-width:42vw;
  white-space:nowrap;
  user-select:none;
  will-change:transform,opacity,left,top;
  opacity:var(--float-opacity);
}
.floatText.float-rise{animation-name:floatRise}
.floatText.float-drift{animation-name:floatDrift}
.floatText.float-side{animation-name:floatSide}
.floatText.float-pulse{animation-name:floatPulse}
@keyframes floatRise{
  0%{opacity:0;transform:translate3d(0,35px,0) scale(.92)}
  15%{opacity:var(--float-opacity)}
  80%{opacity:calc(var(--float-opacity) * .7)}
  100%{opacity:0;transform:translate3d(0,-140px,0) scale(1.05)}
}
@keyframes floatDrift{
  0%{opacity:0;transform:translate3d(-35px,25px,0) rotate(-2deg)}
  15%{opacity:var(--float-opacity)}
  50%{transform:translate3d(25px,-15px,0) rotate(2deg)}
  100%{opacity:0;transform:translate3d(-15px,-95px,0) rotate(-1deg)}
}
@keyframes floatSide{
  0%{opacity:0;transform:translate3d(-120px,0,0) scale(.9)}
  15%{opacity:var(--float-opacity)}
  50%{transform:translate3d(35px,-8px,0) scale(1)}
  100%{opacity:0;transform:translate3d(180px,-15px,0) scale(1.04)}
}
@keyframes floatPulse{
  0%{opacity:0;transform:scale(.72)}
  18%{opacity:var(--float-opacity);transform:scale(1)}
  45%{transform:scale(1.08)}
  70%{opacity:calc(var(--float-opacity) * .7);transform:scale(.96)}
  100%{opacity:0;transform:scale(1.15)}
}
.floatSettings input[type="range"]{width:100%;margin:6px 0 14px}
.floatSettingRow{display:flex;justify-content:space-between;gap:12px;margin-top:3px;font-size:13px}
.floatSettingRow b{font-variant-numeric:tabular-nums}
@media(max-width:650px){.floatText{max-width:70vw}}

/* =========================
   MUSIC
========================= */

.musicHero{
  text-align:center;
  padding:5px 0 20px;
}

.albumWrap{
  display:flex;
  justify-content:center;
}

.album{
  width:145px;
  height:145px;
  display:grid;
  place-items:center;
  border-radius:50%;
  font-size:55px;
  background:
    radial-gradient(circle,#222a45 0 15%,#101625 16% 38%,#6575ff 39% 42%,#171c2d 43%);
  box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.album.playing{
  animation:spin 5s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.musicName{
  margin-top:18px;
  font-weight:900;
  font-size:20px;
  word-break:break-word;
}

.musicStatus{
  color:var(--muted);
  margin-top:5px;
}

.musicProgress{
  margin-top:20px;
}

.musicProgress input{
  width:100%;
}

.musicTimes{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
}

.musicControls{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:15px;
}

.musicBtn{
  width:48px;
  height:48px;
  border:1px solid var(--border);
  border-radius:50%;
  background:rgba(127,127,127,.08);
  color:var(--text);
}

.musicBtn.main{
  width:58px;
  height:58px;
  background:linear-gradient(135deg,#6878ff,#865fff);
  color:#fff;
}

.track{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin-bottom:8px;
  border:1px solid var(--border);
  border-radius:15px;
}

.trackIcon{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:rgba(127,127,127,.1);
}

.trackInfo{
  flex:1;
  min-width:0;
}

.trackName{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.trackMeta{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   FILES
========================= */

.fileSearch{
  margin-top:10px;
}

.fileItem{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  margin-bottom:8px;
  border:1px solid var(--border);
  border-radius:15px;
}

.fileIcon{
  font-size:26px;
}

.fileInfo{
  min-width:0;
}

.fileName{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.fileMeta{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

/* =========================
   PHOTOS
========================= */

.photoToolbar{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
}

.photoGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.photoItem{
  position:relative;
  aspect-ratio:1;
  overflow:hidden;
  border-radius:14px;
  border:1px solid var(--border);
  background:#111;
}

.photoItem img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

.photoItem button{
  position:absolute;
  top:6px;
  right:6px;
  width:28px;
  height:28px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
}

/* =========================
   VIEWER
========================= */

#viewer{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.9);
}

#viewer.show{
  display:flex;
}

#viewerImage{
  max-width:95vw;
  max-height:90vh;
  object-fit:contain;
  border-radius:12px;
}

#viewerClose{
  position:absolute;
  top:20px;
  right:20px;
  width:44px;
  height:44px;
  border:0;
  border-radius:14px;
  background:rgba(255,255,255,.1);
  color:white;
  font-size:25px;
}

/* =========================
   SEARCH
========================= */

.searchResult{
  padding:14px;
  margin-top:7px;
  border:1px solid var(--border);
  border-radius:14px;
  cursor:pointer;
}

.searchResult:hover{
  background:rgba(127,127,127,.1);
}

/* =========================
   TOGGLE
========================= */

.toggle{
  width:54px;
  height:30px;
  padding:3px;
  border:0;
  border-radius:30px;
  background:#4c5363;
}

.toggle i{
  display:block;
  width:24px;
  height:24px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.toggle.on{
  background:#6675ff;
}

.toggle.on i{
  transform:translateX(24px);
}

/* =========================
   PERFORMANCE
========================= */

body.performance *{
  animation-duration:.001ms !important;
  transition-duration:.001ms !important;
}

body.performance .floatText{
  display:none;
}

/* =========================
   ANNOUNCEMENTS
========================= */
.announcementBar{
  width:100%;
  margin:18px 0 4px;
  padding:13px 16px;
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid rgba(120,140,180,.18);
  border-radius:16px;
  background:rgba(255,255,255,.055);
  color:inherit;
  cursor:pointer;
  text-align:left;
  transition:.2s ease;
}
.announcementBar:hover{transform:translateY(-1px);}
.announcementBell{font-size:18px;}
.announcementBarLabel{font-size:12px;font-weight:800;opacity:.72;white-space:nowrap;}
#announcementBarText{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;}
.announcementArrow{font-size:24px;opacity:.5;}
.announcementCard{
  position:relative;
  padding:17px;
  margin-bottom:12px;
  border:1px solid rgba(120,140,180,.18);
  border-radius:16px;
  background:rgba(255,255,255,.045);
}
.announcementCard.unread{
  border-color:rgba(110,170,255,.42);
  box-shadow:0 0 0 1px rgba(110,170,255,.08) inset;
}
.announcementTop{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.announcementTitle{font-weight:900;font-size:17px;flex:1;}
.announcementBadge{font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;background:rgba(110,170,255,.16);}
.announcementDate{font-size:11px;opacity:.55;margin-top:8px;}
.announcementContent{line-height:1.7;white-space:pre-wrap;word-break:break-word;}
.announcementActions{display:flex;gap:8px;margin-top:12px;}
.announcementActions .btn{flex:1;}

/* =========================
   V19 EXTRA FEATURES
========================= */
body.dynamicWallpaper:before{
  animation:zenWallpaper 14s ease-in-out infinite alternate;
  background:
    radial-gradient(circle at 15% 20%,rgba(93,111,255,.25),transparent 28%),
    radial-gradient(circle at 85% 70%,rgba(0,220,255,.14),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(170,70,255,.12),transparent 32%);
}
@keyframes zenWallpaper{
  0%{transform:scale(1) rotate(0deg)}
  100%{transform:scale(1.08) rotate(2deg)}
}
body.performance.dynamicWallpaper:before{animation:none}
.controlGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.controlItem{padding:16px;border:1px solid var(--border);border-radius:17px;background:rgba(127,127,127,.055)}
.controlItem b{display:block;margin-bottom:6px}
.stopwatchTime{font-size:52px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.stopwatchButtons{display:flex;gap:8px;margin-top:14px}
.stopwatchButtons .btn{flex:1}
.game2048{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:9px;border-radius:18px;background:rgba(127,127,127,.12);touch-action:manipulation}
.tile2048{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:rgba(127,127,127,.13);font-size:24px;font-weight:900}
.game2048Hint{text-align:center;color:var(--muted);font-size:12px;margin:10px 0}
.spectrumCanvas{width:100%;height:90px;display:block;margin-top:14px;border-radius:14px;background:rgba(0,0,0,.14)}
@media(max-width:650px){.controlGrid{grid-template-columns:1fr}.stopwatchTime{font-size:44px}}

/* =========================
   ZEN CHAT HOME ENTRY
========================= */
.chatHero{
  max-width:1250px;
  margin:14px auto 15px;
  padding:20px 22px;
  border:1px solid rgba(109,124,255,.28);
  border-radius:24px;
  background:
    radial-gradient(circle at 88% 18%,rgba(109,124,255,.22),transparent 34%),
    linear-gradient(135deg,rgba(109,124,255,.12),rgba(127,127,127,.045));
  color:var(--text);
  text-align:left;
  box-shadow:0 12px 35px rgba(60,70,140,.10);
  transition:.2s ease;
  cursor:pointer;
}
.chatHero:hover{
  transform:translateY(-2px);
  border-color:rgba(109,124,255,.48);
}
.chatHeroMain{
  display:flex;
  align-items:center;
  gap:16px;
}
.chatHeroIcon{
  width:58px;
  height:58px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:18px;
  font-size:30px;
  background:linear-gradient(135deg,#6878ff,#865fff);
  box-shadow:0 10px 25px rgba(100,110,255,.28);
}
.chatHeroContent{min-width:0;flex:1}
.chatHeroTitleRow{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}
.chatHeroTitle{font-size:20px;font-weight:900}
.chatHeroSub{margin-top:4px;color:var(--muted);font-size:13px}
.chatHeroStats{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:11px;
  flex-wrap:wrap;
}
.chatPill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 9px;
  border-radius:999px;
  background:rgba(127,127,127,.10);
  font-size:12px;
  font-weight:800;
}
.chatPill.online::before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:#42d982;
  box-shadow:0 0 0 3px rgba(66,217,130,.12);
}
.chatPill.unread{background:rgba(109,124,255,.14)}
.chatHeroArrow{
  flex:none;
  font-size:30px;
  opacity:.5;
  margin-left:auto;
}
.chatUnreadBadge{
  display:none;
  min-width:22px;
  height:22px;
  padding:0 7px;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  background:#6d7cff;
  color:#fff;
  font-size:11px;
  font-weight:900;
}
.chatUnreadBadge.show{display:inline-flex}
@media(max-width:650px){
  .chatHero{margin:12px 0 12px;padding:16px}
  .chatHeroIcon{width:52px;height:52px;border-radius:16px;font-size:27px}
  .chatHeroTitle{font-size:18px}
  .chatHeroArrow{font-size:26px}
}

@media(max-width:900px){
  .hero{
    grid-template-columns:1fr;
  }

  .appGrid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:650px){
  .topbar{
    padding:0 13px;
  }

  .brand span{
    display:none;
  }

  .desktop{
    padding:15px;
    padding-bottom:100px;
  }

  .heroCard,
  .statusCard{
    padding:22px;
  }

  .heroCard h1{
    font-size:42px;
  }

  .heroTime{
    margin-top:25px;
    font-size:43px;
  }

  .appGrid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .appCard{
    min-height:125px;
    padding:15px;
  }

  .dock{
    bottom:12px;
    max-width:calc(100% - 20px);
    overflow:auto;
  }

  .dock button{
    flex:none;
  }

  .modalBox{
    max-height:92vh;
    border-radius:22px;
  }

  .photoGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .row{
    flex-direction:column;
  }
}
</style>

<!-- =========================
     LOCK SCREEN
========================= -->

<div id="lock">

  <div class="lockBox">

    <div class="lockLogo">Z</div>

    <div id="lockTime">00:00:00</div>
    <div id="lockDate">ZEN OS</div>

    <input
      id="pinInput"
      class="pinInput"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      maxlength="4"
      placeholder="PIN">

    <div class="lockButtons">

      <button
        id="unlockBtn"
        class="btn primary">
        解锁
      </button>

      <button
        id="directBtn"
        class="btn">
        进入系统
      </button>

    </div>

    <div
      class="muted"
      style="margin-top:15px">
      ZEN OS V19
    </div>

  </div>

</div>

========================= -->

<div id="app">

  <header class="topbar">

    <div class="brand">
      <div class="brandLogo">Z</div>

    <div class="topRight">

      <div
        id="topTime"
        class="topTime">

      <button

        id="themeQuick"
        title="Theme">
        ◐

    </div>

  </header>


  <main class="desktop">

    <section class="hero">

      <div class="heroCard">

        <h1 id="heroTitle">
          Welcome.

        <div
          id="heroSub"
          class="heroSub">
          ZEN OS Web Desktop
        </div>

        <div
          id="heroTime"
          class="heroTime">

        <div
          id="heroDate"
          class="heroDate">
          —

      </div>


      <div class="statusCard">

        <div class="statusLine">

    <button

        </div>
        <div class="chatHeroArrow">→</div>
      </div>
    </button>

      <button

        <div class="appDesc" data-i18n="noticeDesc">系统消息</div>
      </button>

      <button
        class="appCard"
        data-action="settings">

        <div class="appName" data-i18n="settings">设置</div>

      <button

        data-action="system">
        <div class="appIcon">⚡</div>
        <div class="appName" data-i18n="systemStatus">系统状态</div>

      <button

        <div class="appName" data-i18n="timeCenter">当前时间</div>

      </button>

      <button class="appCard" data-action="control">

      <button class="appCard" data-action="stopwatch">

      </button>

      <button class="appCard" data-action="game2048">
        <div class="appIcon">🔢</div>
        <div class="appName" data-i18n="game2048">2048</div>
        <div class="appDesc" data-i18n="game2048Desc">数字合成游戏</div>
      </button>

      <button
        class="appCard"
        data-action="search">
        <div class="appIcon">🔍</div>
        <div class="appName" data-i18n="search">搜索</div>
        <div class="appDesc" data-i18n="searchDesc">搜索 App</div>
      </button>

      <button
        class="appCard"
        data-action="telegram">
        <div class="appIcon">✈️</div>
        <div class="appName" data-i18n="telegram">Telegram 社群</div>
        <div class="appDesc" data-i18n="telegramDesc">加入 ZEN OS 官方社群</div>
      </button>

      <button
        class="appCard"
        data-action="serverApi">

        <div class="appName" data-i18n="serverApi">服务器 API</div>

      </button>

      <button
        class="appCard"
        data-action="about">
        <div class="appIcon">ℹ️</div>
        <div class="appName" data-i18n="about">关于 ZEN OS</div>
        <div class="appDesc">V19.0</div>
      </button>

    </section>

  </main>

</div>

/* =========================================================
   STORAGE
========================================================= */

function saveState(){

  try{

    const data = {
      version:APP_VERSION,
      theme:state.theme,
      language:state.language,
      floatEnabled:state.floatEnabled,
      floatText:state.floatText,
      floatMode:state.floatMode,
      floatSpeed:state.floatSpeed,
      floatDensity:state.floatDensity,
      floatOpacity:state.floatOpacity,
      floatSize:state.floatSize,
      floatMax:state.floatMax,
      performance:state.performance,
      pin:state.pin,
      announcementRead:Array.isArray(state.announcementRead) ? state.announcementRead.slice(0,100) : [],
      dynamicWallpaper:state.dynamicWallpaper !== false,
      serverApiUrl:typeof state.serverApiUrl === "string" ? state.serverApiUrl.slice(0,500) : "/api",
      serverApiEnabled:state.serverApiEnabled !== false,
      serverApiAnnouncements:state.serverApiAnnouncements !== false
    };

    localStorage.setItem(
      STORE_KEY,
      JSON.stringify(data)
    );

  }catch(err){

    console.warn(
      "Storage save failed",
      err
    );

  }

}


function loadState(){

  try{

    let raw =
      localStorage.getItem(STORE_KEY);

    if(!raw){
      raw = localStorage.getItem(LEGACY_STORE_KEY);
      if(raw){
        try{
          localStorage.setItem(STORE_KEY, raw);
          localStorage.removeItem(LEGACY_STORE_KEY);
        }catch(e){}
      }
    }

    if(!raw)
      return;

    const saved =
      JSON.parse(raw);

    if(
      !saved ||
      typeof saved !== "object"
    )
      return;

    state.theme =
      ["dark","light","auto"].includes(saved.theme)
        ? saved.theme
        : "dark";

    state.language =
      saved.language === "en"
        ? "en"
        : "zh";

    state.floatEnabled =
      saved.floatEnabled !== false;

    state.floatText =
      typeof saved.floatText === "string" &&
      saved.floatText.trim()
        ? saved.floatText.slice(0,100)
        : "ZEN OS";

    state.floatMode = ["rise","drift","side","pulse"].includes(saved.floatMode) ? saved.floatMode : "rise";
    state.floatSpeed = Number.isFinite(Number(saved.floatSpeed)) ? Math.min(2, Math.max(.4, Number(saved.floatSpeed))) : 1;
    state.floatDensity = Number.isFinite(Number(saved.floatDensity)) ? Math.min(3, Math.max(.5, Number(saved.floatDensity))) : 1;
    state.floatOpacity = Number.isFinite(Number(saved.floatOpacity)) ? Math.min(1, Math.max(.15, Number(saved.floatOpacity))) : .55;
    state.floatSize = Number.isFinite(Number(saved.floatSize)) ? Math.min(32, Math.max(10, Number(saved.floatSize))) : 16;
    state.floatMax = Number.isFinite(Number(saved.floatMax)) ? Math.min(40, Math.max(4, Math.floor(Number(saved.floatMax)))) : 18;

    state.performance =
      saved.performance === true;

    state.pin =
      /^\d{4}$/.test(saved.pin || "")
        ? saved.pin
        : "";

    state.dynamicWallpaper = saved.dynamicWallpaper !== false;
    state.serverApiUrl = typeof saved.serverApiUrl === "string" && saved.serverApiUrl.trim() ? saved.serverApiUrl.trim().slice(0,500) : "/api";
    state.serverApiEnabled = saved.serverApiEnabled !== false;
    state.serverApiAnnouncements = saved.serverApiAnnouncements !== false;

    state.announcementRead =
      Array.isArray(saved.announcementRead)
        ? saved.announcementRead.filter(id => typeof id === "string").slice(0,100)
        : [];

  }catch(err){

    console.warn(
      "Storage load failed",
      err
    );

    state.theme = "dark";
    state.language = "zh";
    state.floatEnabled = true;
    state.floatText = "ZEN OS";
    state.floatMode = "rise";
    state.floatSpeed = 1;
    state.floatDensity = 1;
    state.floatOpacity = .55;
    state.floatSize = 16;
    state.floatMax = 18;
    state.performance = false;
    state.pin = "";

  }

}


/* =========================================================
   THEME
========================================================= */

function applyTheme(){

  document.body.classList.remove("light");

  if(state.theme === "light"){

    document.body.classList.add("light");

  }

  if(state.theme === "auto"){

    try{

      const media =
        window.matchMedia(
          "(prefers-color-scheme:light)"
        );

      if(media.matches)
        document.body.classList.add("light");

    }catch(e){}

  }

  document.body.classList.toggle("dynamicWallpaper", state.dynamicWallpaper && !state.performance);
  updateMetaTheme();

}


function updateMetaTheme(){

  const meta =
    document.querySelector(
      'meta[name="theme-color"]'
    );

  if(meta){

    meta.content =
      document.body.classList.contains("light")
        ? "#edf1f8"
        : "#080b14";

  }

}


function cycleTheme(){

  if(state.theme === "dark")
    state.theme = "light";
  else if(state.theme === "light")
    state.theme = "auto";
  else
    state.theme = "dark";

  saveState();
  applyTheme();

  toast(themeName());

}


function themeName(){

  if(state.theme === "light")
    return t("light");

  if(state.theme === "auto")
    return t("auto");

  return t("dark");

}

/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

  const d = new Date();

  const locale =
    state.language === "zh"
      ? "zh-CN"
      : "en-US";

  const time =
    d.toLocaleTimeString(
      locale,
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }
    );

  const date =
    d.toLocaleDateString(
      locale,
      {
        year:"numeric",
        month:"long",
        day:"numeric",
        weekday:"long"
      }
    );

  [
    "topTime",
    "heroTime",
    "bigTime",
    "lockTime"
  ].forEach(id => {

    const el = $(id);

    if(el)
      el.textContent = time;

  });

  [
    "heroDate",
    "bigDate",
    "lockDate"
  ].forEach(id => {

    const el = $(id);

    if(el)
      el.textContent = date;

  });

  const modalClock =
    $("modalClock");

  if(modalClock)
    modalClock.textContent = time;

}

/* =========================================================
   BATTERY
========================================================= */

async function initBattery(){

  try{

    if(
      !navigator.getBattery ||
      typeof navigator.getBattery !== "function"
    ){

      updateBatteryUnsupported();
      return;

    }

    batteryManager =
      await navigator.getBattery();

    updateBatteryUI();

    batteryManager.addEventListener(
      "levelchange",
      updateBatteryUI
    );

    batteryManager.addEventListener(
      "chargingchange",
      updateBatteryUI
    );

  }catch(err){

    console.warn(
      "Battery unavailable",
      err
    );

    updateBatteryUnsupported();

  }

}


function updateBatteryUnsupported(){

  if($("batteryText"))
    $("batteryText").textContent = "—";

  if($("systemBattery"))
    $("systemBattery").textContent = "—";

}


function updateBatteryUI(){

  if(!batteryManager){

    if(
      !navigator.getBattery ||
      typeof navigator.getBattery !== "function"
    )
      updateBatteryUnsupported();

    return;

  }

  const level =
    Math.round(
      batteryManager.level * 100
    );

  if($("batteryText"))
    $("batteryText").textContent =
      level + "%";

  if($("systemBattery"))
    $("systemBattery").textContent =
      "🔋 " + level + "%";

  if($("systemStatus")){

    if(batteryManager.charging){

      $("systemStatus").textContent =
        "⚡ " + t("charging");

    }else{

      $("systemStatus").textContent =
        navigator.onLine
          ? t("ready")
          : t("offline");

    }

  }

}


/* =========================================================
   LOCK
========================================================= */

function enterSystem(){

  /*
    安全修复：设置了 PIN 后，任何入口都不能绕过锁屏。
    只有 PIN 为空时才允许直接进入。
  */
  if(state.pin){

    if($("lock"))
      $("lock").style.display = "flex";

    if($("app"))
      $("app").style.display = "none";

    const input = $("pinInput");
    if(input)
      input.focus();

    toast(
      state.language === "zh"
        ? "请先输入 PIN"
        : "Enter PIN first"
    );

    return false;

  }

  if($("lock"))
    $("lock").style.display = "none";

  if($("app"))
    $("app").style.display = "flex";

  startRuntime();

  toast(
    state.language === "zh"
      ? "欢迎进入 ZEN OS"
      : "Welcome to ZEN OS"
  );

  return true;

}


function unlock(){

  if(!state.pin){

    enterSystem();
    return;

  }

  const now = Date.now();

  if(pinLockedUntil > now){
    const sec = Math.ceil((pinLockedUntil - now) / 1000);
    toast(
      state.language === "zh"
        ? `尝试次数过多，请 ${sec} 秒后再试`
        : `Too many attempts. Try again in ${sec}s`
    );
    return;
  }

  const input = $("pinInput");
  const value = input ? input.value.trim() : "";

  if(!/^\d{4}$/.test(value)){
    toast(
      state.language === "zh"
        ? "请输入4位数字 PIN"
        : "Enter a 4-digit PIN"
    );
    if(input) input.value = "";
    return;
  }

  if(value === state.pin){
    pinFailedAttempts = 0;
    pinLockedUntil = 0;
    if(input) input.value = "";
    enterSystem();
    return;
  }

  pinFailedAttempts++;
  if(input) input.value = "";

  if(pinFailedAttempts >= PIN_MAX_ATTEMPTS){
    pinFailedAttempts = 0;
    pinLockedUntil = Date.now() + PIN_LOCK_MS;
    toast(
      state.language === "zh"
        ? "PIN 错误次数过多，已锁定30秒"
        : "Too many wrong PINs. Locked for 30s"
    );
  }else{
    const left = PIN_MAX_ATTEMPTS - pinFailedAttempts;
    toast(
      state.language === "zh"
        ? `PIN 错误，还可尝试 ${left} 次`
        : `Wrong PIN. ${left} attempts left`
    );
  }

}


/* =========================================================
   RUNTIME
========================================================= */

function startRuntime(){

  if(clockTimer)
    clearInterval(clockTimer);

  clockTimer =
    setInterval(
      updateClock,
      1000
    );

  if(floatTimer)
    clearInterval(floatTimer);

  if(stopwatchTimer)
    clearInterval(stopwatchTimer);

  releaseSpectrumNodes(true);

  scheduleFloatEngine();

  updateClock();

  // Server API is optional; failure falls back to built-in announcements.
  syncServerAnnouncements();

}


/* =========================================================
   FLOAT
========================================================= */

function scheduleFloatEngine(){

  if(floatTimer)
    clearInterval(floatTimer);

  const base = state.performance ? 3200 : 1700;
  const interval = Math.max(550, Math.round(base / Math.max(.5, state.floatDensity || 1)));

  floatTimer = setInterval(createFloatText, interval);
}

function createFloatText(){

  if(!state.floatEnabled || document.hidden)
    return;

  const layer = $("floatTextLayer");
  if(!layer)
    return;

  const current = layer.children.length;
  const max = Math.max(4, Math.min(40, Number(state.floatMax) || 18));
  if(current >= max)
    return;

  const el = document.createElement("div");
  el.className = "floatText float-" + (state.floatMode || "rise");
  el.textContent = state.floatText || "ZEN OS";

  const size = Math.max(10, Math.min(32, Number(state.floatSize) || 16));
  const opacity = Math.max(.15, Math.min(1, Number(state.floatOpacity) || .55));
  const speed = Math.max(.4, Math.min(2, Number(state.floatSpeed) || 1));
  const duration = (6 + Math.random()*4) / speed;

  el.style.left = (Math.random()*86 + 5) + "%";
  el.style.top = (24 + Math.random()*62) + "%";
  el.style.fontSize = (size * (.8 + Math.random()*.45)) + "px";
  el.style.setProperty("--float-opacity", opacity);
  el.style.animationDuration = duration + "s";

  if(state.floatMode === "side"){
    el.style.top = (30 + Math.random()*50) + "%";
  }

  if(state.floatMode === "pulse"){
    el.style.left = (20 + Math.random()*60) + "%";
    el.style.top = (30 + Math.random()*45) + "%";
  }

  layer.appendChild(el);

  const life = Math.ceil(duration * 1000 + 800);
  setTimeout(() => {
    if(el.parentNode)
      el.remove();
  }, life);
}

function clearFloatLayer(){

  const layer =
    $("floatTextLayer");

  if(layer)
    layer.innerHTML = "";

}


/* =========================================================
   TOAST
========================================================= */

function toast(text){

  const box =
    $("toast");

  if(!box)
    return;

  box.textContent =
    String(text);

  box.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(() => {

      box.classList.remove("show");

    },1800);

}


/* =========================================================
   MODAL
========================================================= */

function closeModal(){

  // Disconnect the Web Audio graph before destroying a music modal.
  // This prevents stale MediaElementSource/Analyser nodes from keeping
  // the previous audio element alive after the modal is closed.
  releaseSpectrumNodes(false);

  const modal =
    $("modal");

  const box =
    $("modalBox");

  if(modal)
    modal.classList.remove("show");

  if(box)
    box.innerHTML = "";

  currentModal = null;

}


function openModal(type){

  if(!type)
    return;

  currentModal = type;

  let html = "";

  try{

    switch(type){

      case "calendar":
        html = calendarHTML();
        break;

      case "system":
        html = systemHTML();
        break;

      case "chat":
        window.location.href = "chat.html";
        currentModal = null;
        return;

      case "profile":
        window.location.href = "index_personal_center.html";
        currentModal = null;
        return;

      case "music":
        html = musicHTML();
        break;

      case "files":
        html = filesHTML();
        break;

      case "photos":
        html = photosHTML();
        break;

      case "float":
        html = floatHTML();
        break;

      case "translator":
        html = translatorHTML();
        break;

      case "tools":
        html = toolsHTML();
        break;

      case "game":
        html = gameHTML();
        break;

      case "notice":
        html = noticeHTML();
        break;

      case "settings":
        html = settingsHTML();
        break;

      case "search":
        html = searchHTML();
        break;

      case "about":
        html = aboutHTML();
        break;

      case "serverApi":
        html = serverApiHTML();
        break;

      case "telegram":
        openTelegramCommunity();
        currentModal = null;
        return;

      case "control":
        html = controlHTML();
        break;

      case "stopwatch":
        html = stopwatchHTML();
        break;

      case "game2048":
        html = game2048HTML();
        break;

      default:
        currentModal = null;
        return;

    }

    const box =
      $("modalBox");

    const modal =
      $("modal");

    if(!box || !modal)
      return;

    box.innerHTML = html;
    modal.classList.add("show");

    afterModalOpen(type);

  }catch(err){

    console.error(
      "Modal error:",
      err
    );

    toast(
      state.language === "zh"
        ? "模块加载失败"
        : "Module failed"
    );

  }

}


function afterModalOpen(type){

  if(type === "notice")
    renderAnnouncements();

  if(type === "control")
    syncControlUI();

  if(type === "stopwatch")
    renderStopwatch();

  if(type === "game2048")
    render2048();

  if(type === "music"){

    renderPlaylist();

    const audio =
      $("audioPlayer");

    if(audio){

      audio.addEventListener(
        "timeupdate",
        updateMusicProgress
      );

      audio.addEventListener(
        "loadedmetadata",
        updateMusicDuration
      );

      audio.addEventListener(
        "play",
        () => {

          $("albumVisual")
            ?.classList.add("playing");

          initSpectrum(audio);
          try{ audioContext?.resume(); }catch(e){}

          const track =
            state.musicTracks[
              state.currentTrack
            ];

          if($("musicStatus"))
            $("musicStatus").textContent =
              track
                ? track.name
                : t("music");

        }
      );

      audio.addEventListener(
        "pause",
        () => {

          $("albumVisual")
            ?.classList.remove("playing");
          stopSpectrum();

        }
      );

      audio.addEventListener(
        "ended",
        nextTrack
      );

    }

  }

  if(type === "files")
    renderFiles();

  if(type === "photos")
    renderPhotos();

  if(type === "translator"){

    if($("sourceLanguage"))
      $("sourceLanguage").value = "zh";

    if($("targetLanguage"))
      $("targetLanguage").value = "en";

  }

}

function initSpectrum(audio){
  const canvas=$("spectrumCanvas");
  if(!canvas || !audio) return;
  try{
    if(!audioContext || audioContext.state === "closed")
      audioContext=new (window.AudioContext||window.webkitAudioContext)();

    /* 每个 HTMLMediaElement 只能创建一次 MediaElementSource。
       Modal 重建后会得到新的 audio 元素，因此必须重新绑定。 */
    if(spectrumAudio !== audio || !audioSourceNode){
      releaseSpectrumNodes(false);

      audioSourceNode=audioContext.createMediaElementSource(audio);
      audioAnalyser=audioContext.createAnalyser();
      audioAnalyser.fftSize=128;
      audioSourceNode.connect(audioAnalyser);
      audioAnalyser.connect(audioContext.destination);
      spectrumAudio=audio;
    }

    drawSpectrum();
  }catch(e){
    console.warn("Spectrum unavailable",e);
  }
}
function drawSpectrum(){
  const canvas=$("spectrumCanvas");
  if(!canvas || !audioAnalyser) return;
  const dpr=Math.max(1,window.devicePixelRatio||1);
  const rect=canvas.getBoundingClientRect();
  canvas.width=Math.max(1,Math.floor(rect.width*dpr));
  canvas.height=Math.max(1,Math.floor(rect.height*dpr));
  const ctx=canvas.getContext("2d");
  if(!ctx) return;
  const data=new Uint8Array(audioAnalyser.frequencyBinCount);
  audioAnalyser.getByteFrequencyData(data);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const w=canvas.width/data.length;
  for(let i=0;i<data.length;i++){
    const h=(data[i]/255)*canvas.height;
    ctx.fillStyle=`rgba(110,125,255,${0.18+data[i]/400})`;
    ctx.fillRect(i*w,canvas.height-h,Math.max(1,w-1),h);
  }
  spectrumFrame=requestAnimationFrame(drawSpectrum);
}
function stopSpectrum(){
  if(spectrumFrame){
    cancelAnimationFrame(spectrumFrame);
    spectrumFrame=0;
  }
}

function releaseSpectrumNodes(closeContext=false){
  stopSpectrum();

  try{ audioSourceNode?.disconnect(); }catch(e){}
  try{ audioAnalyser?.disconnect(); }catch(e){}

  audioSourceNode=null;
  audioAnalyser=null;
  spectrumAudio=null;

  if(closeContext && audioContext){
    try{ audioContext.close(); }catch(e){}
    audioContext=null;
  }
}

function loadMusicFiles(files){

  const list = Array.from(files || []);
  if(!list.length) return;

  const MAX_AUDIO_BYTES = 200 * 1024 * 1024;
  const MAX_AUDIO_COUNT = 50;
  let accepted = 0;

  list.forEach(file => {
    if(accepted >= MAX_AUDIO_COUNT || state.musicTracks.length >= MAX_AUDIO_COUNT) return;

    if(
      !file.type.startsWith("audio/") ||
      file.size > MAX_AUDIO_BYTES
    )
      return;

    state.musicTracks.push({
      name:file.name,
      size:file.size,
      url:URL.createObjectURL(file),
      file:file
    });

  });

  if(
    state.currentTrack < 0 &&
    state.musicTracks.length
  ){

    state.currentTrack = 0;

  }

  renderPlaylist();

  if(state.currentTrack >= 0)
    loadTrack(state.currentTrack);

  toast(
    state.language === "zh"
      ? "音乐已载入"
      : "Music loaded"
  );

}


function renderPlaylist(){

  const box =
    $("musicPlaylist");

  if(!box)
    return;

  box.innerHTML = "";

  if(!state.musicTracks.length){

    box.innerHTML =
      `<div class="section">
        <div class="muted">
          ${t("musicEmpty")}
        </div>
      </div>`;

    return;

  }

  state.musicTracks.forEach(
    (track,index) => {

      const div =
        document.createElement("div");

      div.className = "track";

      div.innerHTML = `
        <div class="trackIcon">
          ${
            index === state.currentTrack
              ? "▶"
              : "🎵"
          }
        </div>

        <div class="trackInfo">

          <div class="trackName">
            ${escapeHtml(track.name)}
          </div>

          <div class="trackMeta">
            ${formatSize(track.size)}
          </div>

        </div>

        <button
          class="btn"
          style="padding:8px 11px"
          data-track="${index}">
          ▶
        </button>
      `;

      box.appendChild(div);

    }
  );

}


function loadTrack(index){

  if(!state.musicTracks[index])
    return;

  const audio =
    $("audioPlayer");

  if(!audio)
    return;

  state.currentTrack = index;

  const track =
    state.musicTracks[index];

  try{

    audio.src = track.url;
    audio.load();

  }catch(err){

    console.warn(
      "Audio load failed",
      err
    );

  }

  if($("musicTitle"))
    $("musicTitle").textContent =
      track.name;

  if($("musicStatus"))
    $("musicStatus").textContent =
      formatSize(track.size);

  renderPlaylist();

}


function playPause(){

  const audio =
    $("audioPlayer");

  if(
    !audio ||
    !audio.src
  ){

    toast(t("musicEmpty"));
    return;

  }

  if(audio.paused){

    audio.play()
      .catch(() => {

        toast(
          state.language === "zh"
            ? "请点击播放按钮"
            : "Tap play to start"
        );

      });

  }else{

    audio.pause();

  }

}


function nextTrack(){

  if(!state.musicTracks.length)
    return;

  let i =
    state.currentTrack + 1;

  if(i >= state.musicTracks.length)
    i = 0;

  loadTrack(i);

  const audio =
    $("audioPlayer");

  if(audio)
    audio.play().catch(()=>{});

}


function previousTrack(){

  if(!state.musicTracks.length)
    return;

  let i =
    state.currentTrack - 1;

  if(i < 0)
    i = state.musicTracks.length - 1;

  loadTrack(i);

  const audio =
    $("audioPlayer");

  if(audio)
    audio.play().catch(()=>{});

}


function updateMusicProgress(){

  const audio =
    $("audioPlayer");

  const seek =
    $("musicSeek");

  if(!audio || !seek)
    return;

  if(
    Number.isFinite(audio.duration) &&
    audio.duration > 0
  ){

    seek.value =
      audio.currentTime /
      audio.duration *
      100;

  }

  if($("musicCurrent"))
    $("musicCurrent").textContent =
      formatTime(audio.currentTime);

}


function updateMusicDuration(){

  const audio =
    $("audioPlayer");

  if(!audio)
    return;

  if($("musicDuration"))
    $("musicDuration").textContent =
      formatTime(audio.duration);

}


function formatTime(sec){

  if(!Number.isFinite(sec))
    return "0:00";

  const min =
    Math.floor(sec / 60);

  const s =
    Math.floor(sec % 60)
      .toString()
      .padStart(2,"0");

  return min + ":" + s;

}

function fileIcon(type){

  if(type.startsWith("image/"))
    return "🖼️";

  if(type.startsWith("audio/"))
    return "🎵";

  if(type.startsWith("video/"))
    return "🎬";

  if(type.includes("pdf"))
    return "📕";

  if(
    type.includes("zip") ||
    type.includes("compressed")
  )
    return "🗜️";

  if(type.includes("text"))
    return "📝";

  return "📄";

}

function loadPhotos(files){

  list.forEach(file => {

    if(
      !file.type.startsWith("image/") ||
      file.size > MAX_IMAGE_BYTES ||
      state.photos.length >= MAX_IMAGE_COUNT
    )
      return;

    const url =
      URL.createObjectURL(file);

    state.photos.push({
      name:file.name,
      size:file.size,
      url:url
    });

  });

  renderPhotos();

}


function renderPhotos(){

  const grid =
    $("photoGrid");

  if(!grid)
    return;

  grid.innerHTML = "";

  if($("photoCount"))
    $("photoCount").textContent =
      state.photos.length;

  if(!state.photos.length){

    grid.innerHTML = `
      <div
        class="section"
        style="grid-column:1/-1">
        <div class="muted">
          ${t("photosEmpty")}
        </div>
      </div>
    `;

    return;

  }

  state.photos.forEach(
    (photo,index) => {

      const div =
        document.createElement("div");

      div.className =
        "photoItem";

      const img =
        document.createElement("img");

      img.src = photo.url;
      img.alt = photo.name;
      img.loading = "lazy";

      img.addEventListener(
        "click",
        () => openViewer(photo.url)
      );

      const del =
        document.createElement("button");

      del.textContent = "×";

      del.addEventListener(
        "click",
        e => {

          e.stopPropagation();

          try{
            URL.revokeObjectURL(photo.url);
          }catch(err){}

          state.photos.splice(index,1);

          renderPhotos();

        }
      );

      div.appendChild(img);
      div.appendChild(del);

      grid.appendChild(div);

    }
  );

}


function openViewer(url){

  if(!$("viewer") || !$("viewerImage"))
    return;

  $("viewerImage").src = url;

  $("viewer").classList.add("show");

}


function closeViewer(){

  if($("viewer"))
    $("viewer").classList.remove("show");

  if($("viewerImage"))
    $("viewerImage").src = "";

}

function saveFloat(){

  const input =
    $("floatInput");

  if(!input)
    return;

  const value =
    input.value.trim();

  if(!value){

    toast(
      state.language === "zh"
        ? "请输入浮字"
        : "Enter floating text"
    );

    return;

  }

  state.floatText = value.slice(0,100);
  state.floatEnabled = true;
  normalizeFloatSettings();
  saveState();
  scheduleFloatEngine();
  toast(t("floatSavedV4"));
  openModal("float");

}


function normalizeFloatSettings(){

  if(!["rise","drift","side","pulse"].includes(state.floatMode))
    state.floatMode = "rise";

  state.floatSpeed = Math.min(2, Math.max(.4, Number(state.floatSpeed) || 1));
  state.floatDensity = Math.min(3, Math.max(.5, Number(state.floatDensity) || 1));
  state.floatOpacity = Math.min(1, Math.max(.15, Number(state.floatOpacity) || .55));
  state.floatSize = Math.min(32, Math.max(10, Math.round(Number(state.floatSize) || 16)));
  state.floatMax = Math.min(40, Math.max(4, Math.round(Number(state.floatMax) || 18)));
}

function updateFloatControlLabels(){
  const map = {
    floatSpeed:["floatSpeedValue", v => Number(v).toFixed(1)+"×"],
    floatDensity:["floatDensityValue", v => Number(v).toFixed(1)+"×"],
    floatOpacity:["floatOpacityValue", v => Math.round(Number(v)*100)+"%"],
    floatSize:["floatSizeValue", v => Math.round(Number(v))+"px"],
    floatMax:["floatMaxValue", v => Math.round(Number(v))]
  };
  Object.entries(map).forEach(([id,[label,fmt]])=>{
    const input=$(id), out=$(label);
    if(input && out) out.textContent=fmt(input.value);
  });
}

function saveFloatSettingsFromUI(){
  const mode=$("floatModeSelect");
  if(mode) state.floatMode=mode.value;
  ["floatSpeed","floatDensity","floatOpacity","floatSize","floatMax"].forEach(id=>{
    const input=$(id);
    if(input){
      const key=id;
      state[key]=Number(input.value);
    }
  });
  normalizeFloatSettings();
  saveState();
  scheduleFloatEngine();
}

function localTranslate(text,from,to){

  const source = String(text || "").trim();

  if(!source)
    return "";

  if(from === to)
    return source;

  const dict = from === "zh" ? CN_EN : EN_CN;
  const normalized = source.toLowerCase();

  const exactKey = Object.keys(dict).find(
    key => key.toLowerCase() === normalized
  );

  if(exactKey)
    return dict[exactKey];

  let result = source;
  const keys = Object.keys(dict).sort((a,b) => b.length-a.length);

  for(const key of keys){

    const escaped = escapeRegExp(key);
    let regex;

    if(from === "en"){
      // Match English words/phrases without requiring a word boundary
      // at punctuation, so "hello!" and "thank you," also work.
      regex = new RegExp(
        "(^|[^A-Za-z])(" + escaped + ")(?=$|[^A-Za-z])",
        "gi"
      );

      result = result.replace(regex, (m, before) => before + dict[key]);

    }else{

      regex = new RegExp(escaped, "g");
      result = result.replace(regex, dict[key]);

    }
  }

  if(result === source){
    return from === "zh"
      ? "本地模式：" + source
      : "Local mode: " + source;
  }

  return result;

}

function calculatorInput(key){
  const display=$("calcDisplay");
  if(!display) return;
  if(key==="C"){ calculatorExpression=""; }
  else if(key==="⌫"){ calculatorExpression=calculatorExpression.slice(0,-1); }
  else if(key==="="){
    const expr=calculatorExpression.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/%/g,"/100");
    if(!/^[0-9+\-*/(). %]+$/.test(expr)){ toast(state.language==="zh"?"表达式无效":"Invalid expression"); return; }
    try{
      const value=Function("\"use strict\";return ("+expr+")")();
      if(!Number.isFinite(value)) throw new Error();
      calculatorExpression=String(Math.round(value*1e10)/1e10);
    }catch(e){ toast(state.language==="zh"?"计算失败":"Calculation failed"); return; }
  }else{
    if(calculatorExpression.length>=60) return;
    calculatorExpression += key;
  }
  display.value=calculatorExpression;
}

    Number(input.value);

    n < 1 ||

let serverAnnouncements = null;

function getApiBase(){
  const raw = String(state.serverApiUrl || "/api").trim();
  if(!raw) return "/api";
  return raw.replace(/\/+$/, "");
}

function apiUrl(path){
  const clean = String(path || "").replace(/^\/+/, "");
  return getApiBase() + "/" + clean;
}

async function apiRequest(path, options = {}){
  if(!state.serverApiEnabled) throw new Error("Server API disabled");
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  try{
    const response = await fetch(apiUrl(path), {
      method: options.method || "GET",
      headers:{"Accept":"application/json", ...(options.body ? {"Content-Type":"application/json"} : {})},
      body: options.body ? JSON.stringify(options.body) : undefined,
      signal:controller.signal,
      credentials:"same-origin",
      cache:"no-store"
    });
    if(!response.ok) throw new Error("HTTP " + response.status);
    const type = response.headers.get("content-type") || "";
    return type.includes("application/json") ? await response.json() : await response.text();
  }finally{
    clearTimeout(timer);
  }
}

async function syncServerAnnouncements(){
  if(!state.serverApiEnabled || !state.serverApiAnnouncements) return;
  try{
    const data = await apiRequest("announcements?lang=" + encodeURIComponent(state.language));
    const list = Array.isArray(data) ? data : (data && Array.isArray(data.announcements) ? data.announcements : []);
    const normalized = list.map((item, index) => ({
      id:String(item.id ?? ("server-" + index)),
      title:String(item.title ?? ""),
      content:String(item.content ?? item.message ?? ""),
      date:String(item.date ?? item.createdAt ?? "").slice(0,40),
      pinned:item.pinned === true,
      isNew:item.isNew === true
    })).filter(item => item.title || item.content);
    serverAnnouncements = normalized;
    updateAnnouncementBar();
    if(currentModal === "notice") renderAnnouncements();
  }catch(err){
    console.warn("ZEN OS announcement API unavailable; using local announcements.", err);
  }
}

function isAnnouncementRead(id){
  return Array.isArray(state.announcementRead) && state.announcementRead.includes(id);
}

function markAnnouncementRead(id){

  if(!Array.isArray(state.announcementRead))
    state.announcementRead = [];

  if(!state.announcementRead.includes(id))
    state.announcementRead.push(id);

  saveState();
  updateAnnouncementBar();
  renderAnnouncements();

}

function markAllAnnouncementsRead(){

  state.announcementRead =
    getAnnouncements().map(item => item.id);

  saveState();
  updateAnnouncementBar();
  renderAnnouncements();
  toast(t("announcementRead"));

}

function updateAnnouncementBar(){

  const bar = $("announcementBarText");
  if(!bar)
    return;

  const list = getAnnouncements();
  const unread = list.filter(item => !isAnnouncementRead(item.id));
  const current = unread[0] || list[0];

  bar.textContent = current ? current.title : t("noAnnouncements");

}

function renderAnnouncements(){

  const box = $("announcementList");
  if(!box)
    return;

  const list = getAnnouncements();

  if(!list.length){
    box.innerHTML = `<div class="section"><div class="muted">${t("noAnnouncements")}</div></div>`;
    return;
  }

  box.innerHTML = "";

  list.forEach(item => {

    const unread = !isAnnouncementRead(item.id);
    const card = document.createElement("div");
    card.className = "announcementCard" + (unread ? " unread" : "");

    const top = document.createElement("div");
    top.className = "announcementTop";

    const title = document.createElement("div");
    title.className = "announcementTitle";
    title.textContent = item.title;

    top.appendChild(title);

    if(item.pinned){
      const badge = document.createElement("span");
      badge.className = "announcementBadge";
      badge.textContent = "📌 " + t("announcementPinned");
      top.appendChild(badge);
    }

    if(item.isNew && unread){
      const badge = document.createElement("span");
      badge.className = "announcementBadge";
      badge.textContent = t("announcementNew");
      top.appendChild(badge);
    }

    const content = document.createElement("div");
    content.className = "announcementContent";
    content.textContent = item.content;

    const date = document.createElement("div");
    date.className = "announcementDate";
    date.textContent = item.date + " · " + (unread ? t("announcementUnread") : t("announcementRead"));

    card.appendChild(top);
    card.appendChild(content);
    card.appendChild(date);

    if(unread){
      const actions = document.createElement("div");
      actions.className = "announcementActions";

      const readBtn = document.createElement("button");
      readBtn.className = "btn";
      readBtn.textContent = t("markRead");
      readBtn.addEventListener("click", () => markAnnouncementRead(item.id));

      actions.appendChild(readBtn);
      card.appendChild(actions);
    }

    box.appendChild(card);

  });

}

      .trim()

  if(!q)

  const matches =
    APPS.filter(app => {

        app[1].toLowerCase();

      const translated =
        t(app[2]).toLowerCase();

        name.includes(q) ||

      );

  if(!matches.length){

      `<div class="muted">

  matches.forEach(app => {

    const div =
      document.createElement("div");

      app[0] + "  " + t(app[2]);

        closeModal();

          () => openModal(app[2]),
          50

    );

    result.appendChild(div);

  });

let stopwatchTimer=null;
let stopwatchStarted=0;
let stopwatchElapsed=0;

function stopwatchHTML(){
  return `
    <div class="modalHead"><h2>⏱️ ${t("stopwatch")}</h2><button class="close" data-close>×</button></div>
    <div class="modalBody">
      <div class="section">
        <div id="stopwatchTime" class="stopwatchTime">00:00.00</div>
        <div class="stopwatchButtons">
          <button class="btn primary" id="stopwatchStart">${t("start")}</button>
          <button class="btn" id="stopwatchReset">${t("resetTimer")}</button>
        </div>
      </div>
      <button class="btn" style="width:100%" data-close>${t("complete")}</button>
    </div>`;
}

function stopwatchValue(){
  return stopwatchElapsed + (stopwatchTimer ? performance.now()-stopwatchStarted : 0);
}
function formatStopwatch(ms){
  const cs=Math.floor(ms/10)%100;
  const sec=Math.floor(ms/1000)%60;
  const min=Math.floor(ms/60000);
  return String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0")+"."+String(cs).padStart(2,"0");
}
function renderStopwatch(){
  const el=$("stopwatchTime");
  if(el) el.textContent=formatStopwatch(stopwatchValue());
}
function toggleStopwatch(){
  if(stopwatchTimer){
    stopwatchElapsed=stopwatchValue();
    clearInterval(stopwatchTimer); stopwatchTimer=null;
  }else{
    stopwatchStarted=performance.now();
    stopwatchTimer=setInterval(renderStopwatch,40);
  }
  renderStopwatch();
  const btn=$("stopwatchStart");
  if(btn) btn.textContent=stopwatchTimer ? t("pause") : t("start");
}
function resetStopwatch(){
  if(stopwatchTimer){clearInterval(stopwatchTimer);stopwatchTimer=null;}
  stopwatchElapsed=0; stopwatchStarted=0; renderStopwatch();
  const btn=$("stopwatchStart"); if(btn) btn.textContent=t("start");
}

let board2048=[];
function new2048(){
  board2048=Array(16).fill(0);
  add2048Tile(); add2048Tile(); render2048();
}
function add2048Tile(){
  const empty=[]; board2048.forEach((v,i)=>{if(!v) empty.push(i);});
  if(!empty.length) return;
  const i=empty[Math.floor(Math.random()*empty.length)];
  board2048[i]=Math.random()<.9?2:4;
}
function slide2048(row){
  const a=row.filter(Boolean);
  for(let i=0;i<a.length-1;i++){
    if(a[i]===a[i+1]){a[i]*=2;a.splice(i+1,1);}
  }
  while(a.length<4)a.push(0);
  return a;
}
function move2048(dir){
  const old=board2048.slice();
  if(dir==="left"||dir==="right"){
    for(let r=0;r<4;r++){
      let row=board2048.slice(r*4,r*4+4);
      if(dir==="right")row.reverse();
      row=slide2048(row);
      if(dir==="right")row.reverse();
      board2048.splice(r*4,4,...row);
    }
  }else{
    for(let c=0;c<4;c++){
      let col=[0,1,2,3].map(r=>board2048[r*4+c]);
      if(dir==="down")col.reverse();
      col=slide2048(col);
      if(dir==="down")col.reverse();
      for(let r=0;r<4;r++)board2048[r*4+c]=col[r];
    }
  }
  if(board2048.some((v,i)=>v!==old[i])) add2048Tile();
  render2048();
}
function render2048(){
  const box=$("game2048Board"); if(!box)return;
  box.innerHTML="";
  board2048.forEach(v=>{const d=document.createElement("div");d.className="tile2048";d.textContent=v||"";box.appendChild(d);});
}
function game2048HTML(){
  if(!board2048.length)new2048();
  return `
    <div class="modalHead"><h2>🔢 ${t("game2048")}</h2><button class="close" data-close>×</button></div>
    <div class="modalBody">
      <div class="game2048Hint">Swipe / Arrow keys · ${t("newGame")}</div>
      <div id="game2048Board" class="game2048" tabindex="0"></div>
      <button class="btn primary" style="width:100%;margin-top:12px" id="new2048">${t("newGame")}</button>
      <button class="btn" style="width:100%;margin-top:10px" data-close>${t("complete")}</button>
    </div>`;
}

const CHAT_PRESENCE_KEY = "zenChatPresenceId";
const CHAT_LAST_SEEN_KEY = "zenChatLastSeen";
let chatPresenceTimer = null;

function getChatPresenceId(){
  let id = "";
  try{ id = localStorage.getItem(CHAT_PRESENCE_KEY) || ""; }catch(err){}
  if(!id){
    id = "z" + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
    try{ localStorage.setItem(CHAT_PRESENCE_KEY,id); }catch(err){}
  }
  return id;
}

async function refreshChatHomeStatus(){
  if(!state.serverApiEnabled) return;
  try{
    const presence = await apiRequest("chat/presence", {
      method:"POST",
      body:{clientId:getChatPresenceId()}
    });
    const count = Number(presence && presence.onlineCount);
    const online = $("chatOnlineCount");
    if(online) online.textContent = Number.isFinite(count) ? count : "—";
  }catch(err){
    const online = $("chatOnlineCount");
    if(online) online.textContent = "—";
  }

  try{
    const data = await apiRequest("chat/messages");
    const list = Array.isArray(data) ? data : (data && Array.isArray(data.messages) ? data.messages : []);
    const lastSeen = Number(localStorage.getItem(CHAT_LAST_SEEN_KEY) || 0);
    const unread = list.filter(item => {
      const ts = Date.parse(item.date || "");
      return Number.isFinite(ts) && ts > lastSeen;
    }).length;
    const badge = $("chatUnreadBadge");
    const pill = $("chatUnreadPill");
    const label = $("chatUnreadCount");
    if(label) label.textContent = unread > 99 ? "99+" : String(unread);
    if(badge){
      badge.classList.toggle("show", unread > 0);
      badge.textContent = unread > 99 ? "99+" : String(unread);
    }
    if(pill) pill.style.display = unread > 0 ? "inline-flex" : "none";
  }catch(err){
    // Keep the homepage usable if the chat API is temporarily unavailable.
  }
}

function openZenChat(){
  try{ localStorage.setItem(CHAT_LAST_SEEN_KEY, String(Date.now())); }catch(err){}
  window.location.href = "chat.html";
}

function startChatHomeStatus(){
  refreshChatHomeStatus();
  if(chatPresenceTimer) clearInterval(chatPresenceTimer);
  chatPresenceTimer = setInterval(refreshChatHomeStatus, 20000);
}

function doTranslate(){

  const input = $("translateInput");
  const result = $("translateResult");
  const source = $("sourceLanguage");
  const target = $("targetLanguage");

  if(!input || !result || !source || !target)
    return;

  const text = input.value.trim();

  if(!text){
    result.textContent = "";
    return;
  }

  result.textContent = localTranslate(
    text,
    source.value || "zh",
    target.value || "en"
  );

}

function swapLanguages(){

  const source = $("sourceLanguage");
  const target = $("targetLanguage");
  const input = $("translateInput");
  const result = $("translateResult");

  if(!source || !target)
    return;

  const oldSource = source.value;
  source.value = target.value;
  target.value = oldSource;

  if(input && input.value.trim()){
    if(result)
      result.textContent = "";
    doTranslate();
  }

}

/* =========================================================
   COPY
========================================================= */

async function copyText(text){

  const value =
    String(text ?? "");

  try{

    if(
      navigator.clipboard &&
      window.isSecureContext
    ){

      await navigator.clipboard.writeText(
        value
      );

      toast(t("copied"));

      return;

    }

  }catch(e){}

  try{

    const textarea =
      document.createElement("textarea");

    textarea.value = value;

    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    textarea.style.opacity = "0";

    document.body.appendChild(
      textarea
    );

    textarea.focus();
    textarea.select();

    const ok =
      document.execCommand("copy");

    textarea.remove();

    toast(
      ok
        ? t("copied")
        : "Copy unavailable"
    );

  }catch(err){

    toast("Copy unavailable");

  }

}


/* =========================================================
   UTILS
========================================================= */

function formatSize(bytes){

  const n =
    Number(bytes);

  if(!Number.isFinite(n))
    return "0 B";

  if(n < 1024)
    return n + " B";

  if(n < 1024*1024)
    return (
      n/1024
    ).toFixed(1) + " KB";

  if(n < 1024*1024*1024)
    return (
      n/1024/1024
    ).toFixed(1) + " MB";

  return (
    n/1024/1024/1024
  ).toFixed(1) + " GB";

}


function escapeHtml(str){

  return String(str ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeRegExp(str){

  return String(str ?? "")
    .replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );

}


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if(document.hidden)
      clearFloatLayer();

  }
);


window.addEventListener("resize",()=>{
  if(currentModal==="music" && audioAnalyser) drawSpectrum();
});

/* =========================================================
   SYSTEM PREFERENCE
========================================================= */

if(window.matchMedia){

  try{

    const media =
      window.matchMedia(
        "(prefers-color-scheme:light)"
      );

    if(media.addEventListener){

      media.addEventListener(
        "change",
        () => {

          if(state.theme === "auto")
            applyTheme();

        }
      );

    }

  }catch(e){}

}


/* =========================================================
   RESOURCE CLEANUP
========================================================= */

window.addEventListener("beforeunload", () => {

  if(clockTimer)
    clearInterval(clockTimer);

  if(floatTimer)
    clearInterval(floatTimer);

  state.musicTracks.forEach(track => {
    try{
      if(track && typeof track.url === "string" && track.url.startsWith("blob:"))
        URL.revokeObjectURL(track.url);
    }catch(e){}
  });

  state.photos.forEach(photo => {
    try{
      if(photo && typeof photo.url === "string" && photo.url.startsWith("blob:"))
        URL.revokeObjectURL(photo.url);
    }catch(e){}
  });

});


/* =========================================================
   ERROR PROTECTION
========================================================= */

/*
  防止某个非关键 JS 错误直接让整个系统停止。
  关键初始化仍然会正常执行。
*/

window.addEventListener(
  "error",
  event => {

    console.error(
      "ZEN OS runtime error:",
      event.error || event.message
    );

  }
);

window.addEventListener(
  "pagehide",
  () => {
    try{ releaseSpectrumNodes(true); }catch(e){}
    try{
      state.musicTracks.forEach(track => {
        if(track && track.url) URL.revokeObjectURL(track.url);
      });
    }catch(e){}
  }
);

window.addEventListener(
  "unhandledrejection",
  event => {

    console.warn(
      "ZEN OS promise error:",
      event.reason
    );

  }
);


/* =========================================================
   INIT
========================================================= */

(function init(){

  try{

    loadState();
    normalizeFloatSettings();

  }catch(err){

    console.error(
      "loadState failed",
      err
    );

  }


  try{

    applyTheme();

  }catch(err){

    console.error(
      "applyTheme failed",
      err
    );

  }


  try{

    applyLanguage();

  }catch(err){

    console.error(
      "applyLanguage failed",
      err
    );

  }


  document.body.classList.toggle(
    "performance",
    state.performance
  );


  try{

    updateClock();
    updateNetwork();

  }catch(err){

    console.error(
      "basic runtime failed",
      err
    );

  }


  try{

    initBattery();

  }catch(err){

    console.warn(
      "battery init failed",
      err
    );

  }


  /*
    没有 PIN：
    直接进入系统。

    有 PIN：
    保留锁屏。
  */

  if(!state.pin){

    if($("lock"))
      $("lock").style.display = "none";

    if($("app"))
      $("app").style.display = "flex";

    startRuntime();
    syncServerAnnouncements();
    startChatHomeStatus();

  }else{

    if($("lock"))
      $("lock").style.display = "flex";

    if($("app"))
      $("app").style.display = "none";

    updateClock();

  }

})();
</script>
